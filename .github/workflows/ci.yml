name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Offline contracts only — linting, formatting, manifest validation, and tests against frozen
  # fixtures/mocks. No API key, no live LLM call, no paid RAGAS judge run on every push. That
  # means this job proves the citation contract, corpus schema, and recorded-snapshot invariants
  # still hold; it does not measure current hosted-model quality — that's `evals/run_release.py`,
  # an explicit, paid, local/manual command (see regrag-release-hardening-spec.md).
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m scripts.validate_manifest
      - run: ruff check .
      - run: ruff format --check .

      - run: pytest -v
