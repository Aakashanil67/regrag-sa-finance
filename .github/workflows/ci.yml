name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Offline contracts only — linting, formatting, manifest validation, and tests against frozen
  # fixtures/mocks. No API key, no live LLM call, no paid RAGAS judge run on every push. That
  # means this job proves the citation contract, corpus schema, and recorded-snapshot invariants
  # still hold; it does not measure current hosted-model quality — that's `evals/run_release.py`,
  # an explicit, paid, local/manual command (see regrag-release-hardening-spec.md).
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m scripts.validate_manifest
      - run: ruff check .
      - run: ruff format --check .

      # A fresh clone on a machine with core.autocrlf=true (a common Windows default) checked
      # eval/text files out as CRLF even though the committed blob is LF, silently breaking
      # evals/protocol.json's pinned SHA-256 of the sealed holdout files. .gitattributes
      # (`* text=auto eol=lf`) fixes it by pinning line endings regardless of the cloning
      # machine's setting. This step proves it on Linux, in about two seconds, by forcing the
      # exact checkout behaviour that exposed the bug and running the real hash-matching test
      # against the result — delete .gitattributes and this goes red.
      - name: A CRLF-defaulting checkout must still reproduce the sealed holdout hash
        run: |
          git -c core.autocrlf=true checkout-index -a -f --prefix="$RUNNER_TEMP/crlf-check/"
          cd "$RUNNER_TEMP/crlf-check"
          python -m pytest tests/test_eval_protocol.py -k protocol_hash -v

      - run: pytest -v
