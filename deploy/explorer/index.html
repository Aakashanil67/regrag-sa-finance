ence_answer": "Governance, operational risk management, business continuity planning and testing, mapping of interconnections and interdependencies, third-party dependency management, incident management, and resilient ICT including cyber security.", "refusal_reason": null, "refused": false, "type": "single"}, {"answer": "A primary credit bureau is a registered credit bureau authorised by the National Credit Regulator to host full-file consumer credit information, including payment profile information. [ncr_guideline_disputed_credit_complaints, p.2]", "citations": [{"doc_id": "ncr_guideline_disputed_credit_complaints", "page": 2, "section_ref": null, "verified": true}], "closed_book": {"answer": "A primary credit bureau is the credit bureau that originally collected or holds the disputed credit information from the relevant data provider, rather than merely reproducing information obtained from another bureau. In a dispute, it is generally the bureau responsible for investigating and correcting the information where appropriate.", "judges": {"llama": {"correctness": "incorrect", "support": null}, "qwen": {"correctness": "partial", "support": null}}, "refused": false}, "evidence": [{"doc_id": "ncr_guideline_disputed_credit_complaints", "page": 2, "quote": "A registered credit bureau authorised by the NCR to host full-file consumer credit information, including payment profile information"}], "id": "t10", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "correct", "support": "supported"}}, "notices": [], "passages": [{"doc_id": "ncr_guideline_disputed_credit_complaints", "pages": [2, 2], "section": "THE STATUTORY PROVISIONS", "text": "purpose of this guideline is to provide consumers with guidance on the process to follow when submitting complaints regarding disputed or inaccurate information on their credit reports. Primary Credit Bureau: A registered credit bureau authorised by the NCR to host full-file consumer credit information, including payment profile information. Disputes/Challenges: Where a consumer challenges the accuracy of information on their credit profile. A consumer will be considered to have challenged the accuracy of the information on their credit report when it is alleged that the information is: incomplete, outdated or prescribed, factually incorrect, and/or related to fraud."}], "question": "What is a primary credit bureau in the context of disputed credit information?", "reference_answer": "A registered credit bureau authorised by the regulator to host full-file consumer credit information, including payment profile information.", "refusal_reason": null, "refused": false, "type": "single"}, {"answer": "An over-the-counter derivatives provider must engage with the Authority in an open and cooperative way and appropriately disclose any material non-compliance with the Act or material operational failure relating to the provider. [fsca_conduct_standard_otc_derivatives_2018, p.2-3]", "citations": [{"doc_id": "fsca_conduct_standard_otc_derivatives_2018", "page": 2, "section_ref": "para 1", "verified": true}, {"doc_id": "fsca_conduct_standard_otc_derivatives_2018", "page": 3, "section_ref": "para 3", "verified": true}], "closed_book": {"answer": "An over-the-counter derivatives provider must deal with its supervisor openly and cooperatively. It must promptly disclose any material information or change in circumstances that the supervisor would reasonably expect to be informed of.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "partial", "support": null}}, "refused": false}, "evidence": [{"doc_id": "fsca_conduct_standard_otc_derivatives_2018", "page": 3, "quote": "engage with the Authority in an open and cooperative way, and must disclose to the Authority appropriately any material incidence of non-compliance"}], "id": "t11", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "correct", "support": "supported"}}, "notices": ["fsca_conduct_standard_otc_derivatives_2018 is a consultation document, not a final published instrument.", "fsca_conduct_standard_otc_derivatives_2018 is of unconfirmed current status as of 2026-09-08 (no corpus document confirms this; see the manifest's external source)."], "passages": [{"doc_id": "fsca_conduct_standard_otc_derivatives_2018", "pages": [1, 2], "section": "1. Definitions and interpretation", "text": "Page 1 of 13 CONDUCT STANDARD      OF 2018 FINANCIAL SECTOR CONDUCT AUTHORITY FINANCIAL MARKETS ACT 19 OF 2012 CONDUCT STANDARD FOR AUTHORISED OVER-THE-COUNTER DERIVATIVE PROVIDERS Under section 6(8)(b), read with sections 74 and 75, of the Financial Markets Act, 2012 (Act No. 19 of 2012), the Authority hereby publish for comments the Conduct Standard for authorised over-the-counter derivative providers as set out in the Schedule. AUTHORITY Page 2 of 13 SCHEDULE"}, {"doc_id": "fsca_conduct_standard_otc_derivatives_2018", "pages": [2, 3], "section": "3. General principles of the conduct standard", "text": "the fma regulations for the purposes of this conduct standard, the term “ provider ” has the same meaning as “ authorised otc derivative provider ”. This conduct standard is binding on providers. A provider must – at all times act honestly, fairly, with due skill, care and diligence, and in the interests of clients and counterparties and the integrity of the financial markets; Page 3 of 13 communicate information to clients and counterparties in a way which is clear, fair and not misleading; at all times manage conflicts of interest fairly, both between itself and its clients and counterparties; observe proper standards of market conduct; (e) conduct itself in such a manner that does not impede the objects of the Act; (f) maintain knowledge of and comply with all applicable laws, rules and regulations governing its activities; and (g) engage with the Authority in an open and cooperative way, and must disclose to the Authority appropriately any material incidence of non-compliance with the Act or material operational failure relating to the provider. and cooperative way, and must disclose to the authority appropriately any material incidence of non - compliance with the act or material operational failure relating to the provider."}], "question": "What must an over-the-counter derivatives provider do in dealing with its supervisor?", "reference_answer": "It must engage with the Authority in an open and cooperative way and disclose any material non-compliance or material operational failure.", "refusal_reason": null, "refused": false, "type": "single"}, {"answer": "The provider must warn the client in writing about the limitations to the level of client protection entailed by being categorised as a counterparty and the clearing obligations that the client may be subject to. [fsca_conduct_standard_otc_derivatives_2018, p.4]", "citations": [{"doc_id": "fsca_conduct_standard_otc_derivatives_2018", "page": 4, "section_ref": "para 5", "verified": true}], "closed_book": {"answer": "It must warn the client in writing of the consequences of being treated as a counterparty, including that the client will not receive the regulatory protections applicable to clients under the Financial Markets Act and the relevant Conduct Standard.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "correct", "support": null}}, "refused": false}, "evidence": [{"doc_id": "fsca_conduct_standard_otc_derivatives_2018", "page": 4, "quote": "the provider must warn the client in writing of the limitations to the level of client protection a categorisation as a counterparty entails"}], "id": "t12", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "correct", "support": "supported"}}, "notices": ["fsca_conduct_standard_otc_derivatives_2018 is a consultation document, not a final published instrument.", "fsca_conduct_standard_otc_derivatives_2018 is of unconfirmed current status as of 2026-09-08 (no corpus document confirms this; see the manifest's external source)."], "passages": [{"doc_id": "fsca_conduct_standard_otc_derivatives_2018", "pages": [4, 4], "section": "4. Categorisation of clients and counterparties", "text": "Page 4 of 13 (4) A provider must, , request a client that has elected to be categorised as a counterparty to provide information regarding its knowledge and experience in financial markets and specifically in respect of OTC derivatives, to enable the provider to determine whether it is appropriate for the client to be categorised as a counterparty. (5) If the provider determines that it is appropriate for the client to be categorised as a counterparty, the provider must warn the client in writing of the limitations to the level of client protection a categorisation as a counterparty entails and the clearing obligations that the client may be subject to. (6) If a provider determines, on the basis of the information provided by the client that has elected to be categorised as a counterparty, that it would not be appropriate for the client to be categorised as a counterparty, the provider must inform the client in writing."}, {"doc_id": "fsca_conduct_standard_otc_derivatives_2018", "pages": [4, 5], "section": "5. Appropriateness", "text": "of the information provided by the client, that transactions in otc derivatives are not appropriate for that client, the provider must inform the client in writing. Page 5 of 13 (6) If a client elects not to provide the information to enable the provider to assess appropriateness, or if the client provides insufficient information regarding its knowledge and experience, the provider must warn the client, in writing, that the provider is unable to determine whether transactions in OTC derivatives are appropriate for that client. (7) If a client, despite the warnings by a provider as provided for in subparagraphs (5) and (6), elects to execute a transaction or transactions in OTC derivatives, the provider may continue with such transaction or transactions. (8) The provision of warnings required in subparagraphs (5) and (6) does not constitute the provision of advice as contemplated in the Financial Advisory and Intermediary Services Act, 2002 (Act No. 37 of 2002). (9) The warnings required in paragraphs (5) and (6) may be provided in a standardised format."}, {"doc_id": "fsca_conduct_standard_otc_derivatives_2018", "pages": [4, 4], "section": "4. Categorisation of clients and counterparties", "text": ", that it would not be appropriate for the client to be categorised as a counterparty, the provider must inform the client in writing. (7) A provider must, when it becomes aware that a counterparty no longer meets the requirements for a categorisation as a counterparty, take the appropriate action to recategorise such person as a client and to inform the person accordingly. categorisation as a counterparty, take the appropriate action to recategorise such person as a client and to inform the person accordingly."}], "question": "What must a derivatives provider warn a client about once it agrees to treat the client as a counterparty?", "reference_answer": "It must warn the client in writing of the limits on client protection that categorisation as a counterparty brings, and of the clearing obligations the client may face.", "refusal_reason": null, "refused": false, "type": "single"}, {"answer": "No, an intermediary may not be remunerated twice for the same or a similar service under the proposed remuneration framework. [fsca_rdr_2014, p.6]", "citations": [{"doc_id": "fsca_rdr_2014", "page": 6, "section_ref": null, "verified": true}], "closed_book": {"answer": "Generally, no: the proposed framework is intended to prevent “double dipping” where an intermediary receives two forms of remuneration for the same service. Multiple payments may be permitted only where they relate to genuinely separate services, are justified, and comply with the applicable disclosure and conflict-of-interest requirements.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "correct", "support": null}}, "refused": false}, "evidence": [{"doc_id": "fsca_rdr_2014", "page": 6, "quote": "An intermediary may not be remunerated for the same or a similar service twice"}], "id": "t13", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "correct", "support": "supported"}}, "notices": ["fsca_rdr_2014 is a consultation document, not a final published instrument.", "fsca_rdr_2014 is a dated historical snapshot that may not reflect later amendments as of 2026-09-08 (no corpus document confirms this; see the manifest's external source)."], "passages": [{"doc_id": "fsca_rdr_2014", "pages": [6, 6], "section": "EXECUTIVE SUMMARY", "text": "As part of this aim, intermediary remuneration should not undermine reasonable customer benefit expectations or inhibit customers’ access to their savings (such as through early termination charges designed to recover commission costs) O The regulatory framework should recognise the range of services available, the related remuneration for these, and whom may pay or receive it O All remuneration must be reasonable and commensurate with the actual services rendered O Remuneration structures should strike a balance between supporting ongoing service and adequately compensating intermediaries for up-front advice and intermediary services O Ongoing fees and/or commission may only be paid if ongoing advice and services are indeed rendered O An intermediary may not be remunerated for the same or a similar service twice O All fees paid by customers must be motivated, disclosed and explicitly agreed to by the customer O The different types of services and fees should be readily comparable by customers; and O Remuneration structures should promote a level playing field between different types of intermediaries providing similar services."}], "question": "Can an intermediary be paid twice for the same service under the proposed remuneration framework?", "reference_answer": "No. An intermediary may not be remunerated for the same or a similar service twice.", "refusal_reason": null, "refused": false, "type": "single"}, {"answer": "A credit provider may not unfairly discriminate directly or indirectly against a natural person, juristic person, or association of persons on grounds set out in section 9(3) of the Constitution or Chapter 2 of the Promotion of Equality and Prevention of Unfair Discrimination Act when assessing the person’s ability to meet the obligations of a proposed credit agreement. [nca_act_34_2005, p.41]", "citations": [{"doc_id": "nca_act_34_2005", "page": 41, "section_ref": "s 61", "verified": true}], "closed_book": {"answer": "A credit provider may not unfairly discriminate on the grounds of race, gender, sex, marital status, ethnic or social origin, colour, sexual orientation, age, disability, religion, conscience, belief, culture, language or birth when assessing a person’s ability to meet the obligations of a credit agreement.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "correct", "support": null}}, "refused": false}, "evidence": [{"doc_id": "nca_notebook_brochure", "page": 6, "quote": "must not unfairly discriminate directly or indirectly against any natural person, juristic person or association of persons"}], "id": "t14", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "correct", "support": "supported"}}, "notices": [], "passages": [{"doc_id": "nca_act_34_2005", "pages": [41, 41], "section": "61.   Protection against discrimination in respect of credit.—(1)  Relative to the treatment of any other", "text": "consumer or prospective consumer, a credit provider must not unfairly discriminate directly or indirectly against any natural person, juristic person or association of persons on one or more grounds set out in section 9 (3) of the Constitution, or one or more grounds set out in Chapter 2 of the Promotion of Equality and Prevention of Unfair Discrimination Act, when— assessing the ability of the person to meet the obligations of a proposed credit agreement; deciding whether to refuse an application to enter into a credit agreement, or to offer or enter into a credit agreement; determining any aspect of the cost of a credit agreement to the consumer; proposing or agreeing the terms and conditions of a credit agreement; (e) assessing or requiring compliance by the person with the terms of a credit agreement; ( f ) exercising any right of the credit provider under a credit agreement, this Act or applicable provincial legislation; (g) determining whether to continue, enforce, seek judgment in respect of, or terminate a credit agreement; or (h) determining whether to report, or reporting, any credit information or record."}, {"doc_id": "nca_act_34_2005", "pages": [41, 41], "section": "61.   Protection against discrimination in respect of credit.—(1)  Relative to the treatment of any other", "text": "in delivering any such service to consumers ; and an employer or trade union, when acting in terms of section 75 ( 3 ) or ( 4 ). (3)  Subsections (1) and (2) apply in respect of a consumer or prospective consumer that is an association or juristic person to prohibit unfair discrimination against that association or juristic person based on the characteristics of any natural person who is a member, associate, owner, manager, employee, client or customer of that association or juristic person. (4)  It is not discrimination on the basis of age to— refuse to receive or consider an application for credit from an unemancipated minor; or refuse to offer an unlawful credit agreement to, or enter into an unlawful credit agreement with, an unemancipated minor. (5)  A credit provider may determine for itself any scoring or other evaluative mechanism or model to be used in managing, underwriting and pricing credit risk, provided that any such mechanism or model is not founded or structured upon a statistical or other analysis in which the basis of risk categorisation, differentiation or assessment"}], "question": "On what grounds may a credit provider not unfairly discriminate when it assesses a person's ability to meet a credit agreement?", "reference_answer": "It may not unfairly discriminate on grounds set out in section 9(3) of the Constitution or in Chapter 2 of the Promotion of Equality and Prevention of Unfair Discrimination Act.", "refusal_reason": null, "refused": false, "type": "single"}, {"answer": "The pilot found that focus on customer outcomes was clearer at the product-design stage than during other parts of the product life cycle. [fsca_tcf_2011, p.6]", "citations": [{"doc_id": "fsca_tcf_2011", "page": 6, "section_ref": null, "verified": true}], "closed_book": {"answer": "The pilot found that firms generally had policies and processes addressing customer fairness, but had weaker evidence that these translated into consistently good customer outcomes throughout the product life cycle. The main gaps were in demonstrating effective product design and targeting, ongoing monitoring, and avoiding unreasonable post-sale barriers.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "partial", "support": null}}, "refused": false}, "evidence": [{"doc_id": "fsca_tcf_2011", "page": 6, "quote": "Focus on customer outcomes is clearer at design stage than other parts of the product life cycle"}], "id": "t15", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "correct", "support": "supported"}}, "notices": ["fsca_tcf_2011 is a dated historical snapshot that may not reflect later amendments as of 2026-09-08 (no corpus document confirms this; see the manifest's external source)."], "passages": [{"doc_id": "fsca_tcf_2011", "pages": [4, 6], "section": "TCF: The self-assessment pilot (2)", "text": "levels, supported by governance and mi ●the fsb will need a pre - emptive, intensive supervisory approach – with credible and visible enforcement page 4 The pilot process: ●The FSB is piloting a self-assessment process with approximately 20 organisations, across a broad spectrum ●The questionnaire consists of open-ended, qualitative questions plus detailed questions regarding specific processes ●Purpose was both to get feedback and give guidance ●The support from pilot participants has been impressive – THANK YOU Page 5 Some early observations: ●Almost all firms have “customer centricity” (or similar) as a stated value – but not always clear how it translates into decisions and operations ●In large firms there is inconsistent application across parts of the business ●Focus on customer outcomes is clearer at design stage than other parts of the product life cycle ●There is a lot of customer MI gathered, but typically not outcomes focussed – although much of it could readily be adapted for TCF use Page 6"}], "question": "What did the early regulatory self-assessment pilot find about customer outcomes across the product life cycle?", "reference_answer": "The focus on customer outcomes was clearer at the design stage than in other parts of the product life cycle.", "refusal_reason": null, "refused": false, "type": "single"}, {"answer": null, "citations": [], "closed_book": {"answer": null, "judges": {"llama": {"correctness": "refused", "support": null}, "qwen": {"correctness": "refused", "support": null}}, "refused": true}, "evidence": [{"doc_id": "fsca_press_conduct_standard_banks_2020", "page": 1, "quote": "has published the conduct standard for banks along with a document detailing the expected impact of the conduct standard"}], "id": "t16", "judges": {"llama": {"correctness": "refused", "support": null}, "qwen": {"correctness": "refused", "support": null}}, "notices": [], "passages": [], "question": "Which supporting documents accompanied the banks conduct standard when it was released?", "reference_answer": "A document detailing the expected impact of the conduct standard, and a report on the consultation process.", "refusal_reason": "model_refusal", "refused": true, "type": "single"}, {"answer": "The Tribunal may declare the credit agreement reckless and make an order under section 83(2) or (3). [nca_act_34_2005, p.61]\n\nSuch an order may set aside all or part of the consumer’s rights and obligations under the agreement or suspend its force and effect. [nca_act_34_2005, p.55]", "citations": [{"doc_id": "nca_act_34_2005", "page": 61, "section_ref": "s 86", "verified": true}, {"doc_id": "nca_act_34_2005", "page": 55, "section_ref": "s 80", "verified": true}], "closed_book": {"answer": "It may declare the credit agreement reckless and either set aside all or part of the consumer’s rights and obligations under it, or suspend the agreement’s force and effect.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "partial", "support": null}}, "refused": false}, "evidence": [{"doc_id": "nca_act_34_2005", "page": 61, "quote": "an order declaring any credit agreement that forms part of the application to be reckless"}], "id": "t17", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "partial", "support": "supported"}}, "notices": [], "passages": [{"doc_id": "nca_act_34_2005", "pages": [61, 61], "section": "86 (7) (c) (ii); or", "text": "reject the recommendation or application as the case may be ; or make — ( i ) an order declaring any credit agreement that forms part of the application to be reckless, and make an order contemplated in section 83 ( 2 ) or ( 3 ), if the tribunal concludes that agreement is reckless ; ( ii ) an order that one or more of the debt intervention applicant ’ s obligations be rearranged by — ( aa ) extending the period of the agreement and reducing the amount of each payment due accordingly ; ( bb ) postponing during a specified period the dates on which payments are due under the agreement ; ( cc ) extending the period of the agreement and postponing during a specified period the dates on which payments are due under the agreement ; ( dd ) determining the maximum interest, fees or other charges, excluding charges contemplated in section 101 ( 1 ) ( e ), under a credit agreement, which maximum may be zero, for such a period as the tribunal deems fair and reasonable but not exceeding the period contemplated in section 86a ( 6 ) ( d ) ; or ( ee ) recalculating the consumer ’ s obligations because of contraventions of part a or b"}, {"doc_id": "nca_act_34_2005", "pages": [55, 55], "section": "80 (1) (b) (ii), the court or Tribunal, as the case may be—", "text": "2014. ] ( 2 ) if a court or tribunal declares that a credit agreement is reckless in terms of section 80 ( 1 ) ( a ) or setting aside all or part of the consumer’s rights and obligations under that agreement, as the court determines just and reasonable in the circumstances; or suspending the force and effect of that credit agreement in accordance with subsection (3) (b) (i). [Sub­s. (2) amended by s. 25 (c) of Act No. 19 of 2014.] (3)  If a court or Tribunal, as the case may be, declares that a credit agreement is reckless in terms of section"}], "question": "What can the Tribunal do about a credit agreement in a debt intervention application if it finds the agreement reckless?", "reference_answer": "It can make an order declaring the credit agreement reckless, together with the related order for reckless credit.", "refusal_reason": null, "refused": false, "type": "single"}, {"answer": "The terms and conditions of a Commissioner’s office may not be reduced during that person’s term of office. [fsr_act_9_2017, p.89-90]", "citations": [{"doc_id": "fsr_act_9_2017", "page": 89, "section_ref": "s 65", "verified": true}, {"doc_id": "fsr_act {"correctness": "incorrect", "support": null}, "qwen": {"correctness": "incorrect", "support": null}}, "refused": false}, "evidence": [{"doc_id": "banks_act_94_1990", "page": 30, "quote": "does not at any time exceed 40 per cent of the sum of its share"}], "id": "t26", "judges": {"llama": {"correctness": "refused", "support": null}, "qwen": {"correctness": "refused", "support": null}}, "notices": [], "passages": [], "question": "What share of its share capital and reserve funds may a controlling company put into non-banking investments?", "reference_answer": "Its investments of that kind may not at any time exceed 40 per cent of the sum of its share capital and reserve funds.", "refusal_reason": "model_refusal", "refused": true, "type": "threshold"}, {"answer": "IFRS 9’s July 2014 version replaced earlier versions, and entities newly applying IFRS 9 from February 2015 had to apply the July 2014 version, although an entity with an initial application date before 1 February 2015 could elect an earlier version for annual periods beginning before 1 January 2018. [ifrs9_project_summary_2014, p.4, Project background] [ifrs9_project_summary_2014, p.29-30, Transition Resource Group] [ifrs9_issued_2021, p.63, IFRS 9 (2013)]", "citations": [{"doc_id": "ifrs9_project_summary_2014", "page": 4, "section_ref": null, "verified": true}, {"doc_id": "ifrs9_project_summary_2014", "page": 29, "section_ref": null, "verified": true}, {"doc_id": "ifrs9_project_summary_2014", "page": 30, "section_ref": null, "verified": true}, {"doc_id": "ifrs9_issued_2021", "page": 63, "section_ref": null, "verified": true}], "closed_book": {"answer": "No. South African banks generally must apply the current IFRS 9 requirements as endorsed in South Africa and applicable under SARB prudential standards, unless a specific transitional provision or regulatory directive permits otherwise.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "partial", "support": null}}, "refused": false}, "evidence": [{"doc_id": "ifrs9_project_summary_2014", "page": 4, "quote": "replaces earlier versions of IFRS 9 and completes the IASB's project to replace IAS 39"}], "id": "t27", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "partial", "support": "supported"}}, "notices": ["ifrs9_issued_2021 is a dated historical snapshot that may not reflect later amendments as of 2026-09-08 (no corpus document confirms this; see the manifest's external source).", "ifrs9_project_summary_2014 is a dated historical snapshot that may not reflect later amendments as of 2026-09-08 (no corpus document confirms this; see the manifest's external source)."], "passages": [{"doc_id": "ifrs9_project_summary_2014", "pages": [4, 4], "section": "Project background", "text": "##sb throughout the development of ifrs 9. although every effort has been made to come to a converged solution, ultimately these efforts have been unsuccessful. Throughout the lifecycle of the project the IASB has consulted widely with constituents and stakeholders on the development of the new standard. The IASB has received over a thousand comment letters from stakeholders and has published six Exposure Drafts, one Supplementary Document and a Discussion Paper during this process. The IASB has also conducted an extensive programme of outreach, including hundreds of meetings with users, preparers of ﬁ nancial statements and others. The IASB has previously published versions of IFRS 9 that introduced new classiﬁ cation and measurement requirements (in 2009 and 2010) and a new hedge accounting model (in 2013). The July 2014 publication represents the ﬁ nal version of the Standard, replaces earlier versions of IFRS 9 and completes the IASB’s project to replace IAS 39."}, {"doc_id": "ifrs9_project_summary_2014", "pages": [29, 30], "section": "Transition Resource Group", "text": "with ifrs 9 as long as the designation reﬂ ects risk management. this in effect maintains the position that existed prior to ifrs 9. IFRS 9 is effective for annual periods beginning on or after 1 January 2018. Entities can however choose to apply IFRS 9 before then. From February 2015 entities newly applying IFRS 9 will need to apply the version published in July 2014.  This means that entities would need to apply the classiﬁ cation and measurement, impairment and hedge accounting requirements1. As an exception to this, prior to January 2018 the own credit changes can be applied at any time in isolation without the need to otherwise change the accounting for ﬁ nancial instruments."}, {"doc_id": "ifrs9_issued_2021", "pages": [63, 63], "section": "IFRS 9 (2013)", "text": "the opening retained earnings ( or other component of equity, as appropriate ) of the annual reporting period that includes the date of initial application of these amendments. This Standard supersedes IFRIC 9 Reassessment of Embedded Derivatives. The requirements added to IFRS 9 in October 2010 incorporated the requirements previously set out in paragraphs 5 and 7 of IFRIC 9. As a consequential amendment, IFRS 1 First-time Adoption of International Financial Reporting Standards incorporated the requirements previously set out in paragraph 8 of IFRIC 9. This Standard supersedes IFRS 9 (2009), IFRS 9 (2010) and IFRS 9 (2013). However, for annual periods beginning before 1 January 2018, an entity may elect to apply those earlier versions of IFRS 9 instead of applying this Standard if, and only if, the entity’s relevant date of initial application is before 1 February 2015. 7.2.45 7.2.46 7.3.1 7.3.2 A427"}], "question": "Is an earlier version of IFRS 9 still the text banks should follow?", "reference_answer": "No. The July 2014 publication is the final version and replaces earlier versions of IFRS 9.", "refusal_reason": null, "refused": false, "type": "status"}, {"answer": "No; Guidance Note 3/2025 replaces Guidance Note 3 of 2024. [sarb_g3_2025_climate_disclosures, p.2]", "citations": [{"doc_id": "sarb_g3_2025_climate_disclosures", "page": 2, "section_ref": "para 370", "verified": true}], "closed_book": {"answer": null, "judges": {"llama": {"correctness": "refused", "support": null}, "qwen": {"correctness": "refused", "support": null}}, "refused": true}, "evidence": [{"doc_id": "sarb_g3_2025_climate_disclosures", "page": 1, "quote": "This Guidance Note replaces Guidance Note 3 of 2024."}], "id": "t28", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "correct", "support": "supported"}}, "notices": [], "passages": [{"doc_id": "sarb_g3_2025_climate_disclosures", "pages": [2, 2], "section": "370 Helen Joseph Street  Pretoria  0002", "text": "2 investments in transition-sensitive sectors.1 1.2. The disclosure of climate-related risks and opportunities promotes market discipline through the provision of meaningful information to stakeholders on a consistent and comparable basis. An essential function of financial markets is to price risk to support informed, efficient capital allocation decisions. The disclosure of relevant information enhances how climate-related risks are assessed, priced and managed nationally and internationally. 1.3. This Guidance Note builds on domestic and international initiatives on climaterelated disclosures, specifically the standards developed by the IFRS, which were built on the recommendations from the Task Force on Climate-related Financial Disclosures (TCFD). Guidance Note 3 of 2024 was published on 10 May 2024. This updated Guidance Note incorporates the BCBS’s framework for the voluntary disclosures of climate-related financial risks2, which was published in June 2025. 1.4. This Guidance Note replaces Guidance Note 3 of 2024. 2. Principles and conceptual foundations for disclosures 2.1. The disclosure of climate-related risks and opportunities continues to evolve as methodologies are being developed and improved."}, {"doc_id": "sarb_g3_2025_climate_disclosures", "pages": [2, 3], "section": "2.1.8. Disclosures should be for the same reporting entity and reporting period as the", "text": "financial - stabilityreview / first % 20edition % 202025 % 20financial % 20stability % 20review. pdf. 3 focused. bank’s financial statements. Connected information within and across disclosures should be clear and cross-referenced where required to avoid duplication and facilitate accessibility. 3. Supervisory expectations 3.1. As a minimum, banks should produce climate-related disclosure reports that reasonably satisfy the principles above as well as relevant supervisory expectations. 3.2. Banks should produce high-quality and decision-useful disclosures in order to increase transparency and confidence about a bank’s approach to climate-related risks and opportunities. Section 1: Qualitative information on climate-related financial risks and opportunities – governance, strategy and risk management 4. Governance 4.1. Banks should disclose the governance practices, processes, controls and procedures in maintaining appropriate oversight over climate-related risks and opportunities. Banks should disclose how these identified climate-related risks and opportunities impact on their business model, strategy and decision-making. Banks should provide sufficient detail on:"}], "question": "Is Guidance Note 3 of 2024 on climate disclosures still the current guidance for banks?", "reference_answer": "No. Guidance Note 3 of 2025 replaces Guidance Note 3 of 2024.", "refusal_reason": null, "refused": false, "type": "status"}, {"answer": "IFRS 9 replaced IAS 39 for financial-instrument accounting, but IAS 39 remains effective for hedge accounting because an entity may choose to apply IAS 39’s hedge-accounting requirements instead of those in IFRS 9. [ifrs9_issued_2021, p.1]", "citations": [{"doc_id": "ifrs9_issued_2021", "page": 1, "section_ref": null, "verified": true}], "closed_book": {"answer": "No. IFRS 9 replaced IAS 39 for most financial-instrument accounting, although entities may elect to continue applying IAS 39’s hedge-accounting requirements instead of IFRS 9’s hedge-accounting model.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "partial", "support": null}}, "refused": false}, "evidence": [{"doc_id": "ifrs9_project_summary_2014", "page": 4, "quote": "IFRS 9 replaces IAS 39, one of the Standards inherited by the IASB when it began its work in 2001"}], "id": "t29", "judges": {"llama": {"correctness": "incorrect", "support": "supported"}, "qwen": {"correctness": "partial", "support": "supported"}}, "notices": ["ifrs9_issued_2021 is a dated historical snapshot that may not reflect later amendments as of 2026-09-08 (no corpus document confirms this; see the manifest's external source)."], "passages": [{"doc_id": "ifrs9_issued_2021", "pages": [1, 1], "section": "Financial Instruments", "text": "In April 2001 the International Accounting Standards Board (Board) adopted IAS 39 Financial Instruments: Recognition and Measurement, which had originally been issued by the International Accounting Standards Committee in March 1999. The Board had always intended that IFRS 9 Financial Instruments would replace IAS 39 in its entirety. However, in response to requests from interested parties that the accounting for financial instruments should be improved quickly, the Board divided its project to replace IAS 39 into three main phases. As the Board completed each phase, it issued chapters in IFRS 9 that replaced the corresponding requirements in IAS 39. In November 2009 the Board issued the chapters of IFRS 9 relating to the classification and measurement of financial assets. In October 2010 the Board added the requirements related to the classification and measurement of financial liabilities to IFRS 9. This includes requirements on embedded derivatives and how to account for changes in own credit risk on financial liabilities designated under the fair value option. In October 2010 the Board also decided to carry forward unchanged from IAS 39 the requirements related to the derecognition of financial assets and financial liabilities."}, {"doc_id": "ifrs9_issued_2021", "pages": [1, 1], "section": "Financial Instruments", "text": "the board also decided to carry forward unchanged from ias 39 the requirements related to the derecognition of financial assets and financial liabilities. Because of these changes, in October 2010 the Board restructured IFRS 9 and its Basis for Conclusions. In December 2011 the Board deferred the mandatory effective date of IFRS 9. In November 2013 the Board added a Hedge Accounting chapter. IFRS 9 permits an entity to choose as its accounting policy either to apply the hedge accounting requirements of IFRS 9 or to continue to apply the hedge accounting requirements in IAS 39. Consequently, although IFRS 9 is effective (with limited exceptions for entities that issue insurance contracts and entities applying the IFRS for SMEs Standard), IAS 39, which now contains only its requirements for hedge accounting, also remains effective. In July 2014 the Board issued the completed version of IFRS 9. The Board made limited amendments to the classification and measurement requirements for financial assets by addressing a narrow range of application questions and by introducing a ‘fair value through other comprehensive income’ measurement category for particular simple debt instruments."}], "question": "Does IAS 39 still govern how financial instruments are accounted for now that IFRS 9 is final?", "reference_answer": "No. IFRS 9 replaces IAS 39 and completes the project to replace it.", "refusal_reason": null, "refused": false, "type": "status"}, {"answer": "The text identifies section 86A as a pending amendment whose commencement date had not been determined, so it does not state that the debt intervention procedure was already in operation. [nca_act_34_2005, p.60]", "citations": [{"doc_id": "nca_act_34_2005", "page": 60, "section_ref": "s 86A", "verified": true}], "closed_book": {"answer": "No. Section 86A of South Africa’s National Credit Act has not yet been brought into operation by proclamation, so the statutory debt-intervention procedure is not currently available.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "correct", "support": null}}, "refused": false}, "evidence": [{"doc_id": "nca_act_34_2005", "page": 60, "quote": "S. 86A to be inserted by s. 13 of Act No. 7 of 2019 with effect from a date fixed by the President by proclamation in the Gazette"}], "id": "t30", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "correct", "support": "partial"}}, "notices": [], "passages": [{"doc_id": "nca_act_34_2005", "pages": [60, 60], "section": "86A.   Application for debt intervention.—(1)  A debt intervention applicant", "text": "credit provider may terminate an application for debt intervention lodged in terms of this act, if such application for debt intervention has already been filed in the tribunal. (11)  If a credit provider who has given notice to terminate the debt intervention as contemplated in subsection (10) proceeds to enforce that agreement in terms of Part C of Chapter 6, the court or the Tribunal hearing the matter may order that the debt intervention resume on any conditions the court or Tribunal considers to be just in the circumstances. (12)  (a) Subsection (6) (e) is effective for a period of 48 months from the date on which it becomes operational. (b)  The Minister must review the impact of section 87A and must, no later than 36 months after subsection (6) (e) becomes operational, table a report in the National Assembly setting out the findings of that review. (Pending amendment: S. 86A to be inserted by s. 13 of Act No. 7 of 2019 with effect from a date fixed by the President by proclamation in the Gazette – date not determined.)"}], "question": "Is the debt intervention procedure in section 86A of the credit statute already in operation?", "reference_answer": "Not yet. Section 86A is only to be inserted from a date fixed by the President by proclamation, and that date has not been determined.", "refusal_reason": null, "refused": false, "type": "status"}, {"answer": "No; the FSCA stated that the conduct standard had been submitted to Parliament as required under section 103 of the FSRA, and it subsequently published Conduct Standard 3 of 2020 for banks. [fsca_press_conduct_standard_banks_2020, p.1] [fsca_cs3_2020_banks, p.1]", "citations": [{"doc_id": "fsca_press_conduct_standard_banks_2020", "page": 1, "section_ref": null, "verified": true}, {"doc_id": "fsca_cs3_2020_banks", "page": 1, "section_ref": null, "verified": true}], "closed_book": {"answer": "Yes. Parliamentary consideration was not the final approval step—the Conduct Standard for Banks still required the Minister of Finance’s approval, which was obtained later in 2020 before publication.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "incorrect", "support": null}}, "refused": false}, "evidence": [{"doc_id": "fsca_press_conduct_standard_banks_2020", "page": 1, "quote": "Having successfully undergone the parliamentary process, the conduct standard has been made final"}], "id": "t31", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "correct", "support": "supported"}}, "notices": [], "passages": [{"doc_id": "fsca_press_conduct_standard_banks_2020", "pages": [1, 1], "section": "", "text": "Transitional Management Committee: AM Sithole (Commissioner)    DP Tshidi    CD da Silva    JA Boyd     MM du Toit    LP Kekana   K Gibson     OB Makhubela    P Mogase FSCA Press Release 08 July 2020 FSCA publishes the conduct standard for banks The Financial Sector Conduct Authority (FSCA) has published the conduct standard for banks along with a document detailing the expected impact of the conduct standard, and a report on the consultation process. The publication of these documents is the first step towards rolling out a comprehensive market conduct regulatory framework for the banking sector. When the Financial Sector Regulation Act (FSRA) was introduced in 2018, the FSCA was given the explicit mandate of regulating and supervising the way banking institutions conduct themselves in relation to the provision of financial products and services to customers. As part of fulfilling this mandate, and considering various risks identified in the sector, the FSCA developed the conduct standard which enables it to supervise banks. The conduct standard underwent a comprehensive public consultation process, coupled with industry specific engagements. It was also submitted to Parliament as required in terms of section 103 of the FSRA."}, {"doc_id": "fsca_cs3_2020_banks", "pages": [1, 1], "section": "", "text": "aN FSCA Financial Sector Conduct Autharity CONDUCT STANDARD 3 OF 2020 (BANKS) FINANCIAL SECTOR REGULATION ACT, 2017 CONDUCT STANDARD FOR BANKS The Financial Sector Conduct Authority, under section 106(1), read with sections 106(2)(b) and 108(1) of the Financial Sector Regulation Act, 2017 (Act No. 9 of 2017), hereby makes a conduct standard setting out requirements applicable to banks, as per the Schedule below. Mima DP TSHIDI FOR THE FINANCIAL SECTOR CONDUCT AUTHORITY Date of publication: © 3 Ju Hi 90 20 1"}], "question": "Was the conduct standard for banks still awaiting approval after it went through Parliament in 2020?", "reference_answer": "No. After the parliamentary process the conduct standard was made final and published.", "refusal_reason": null, "refused": false, "type": "status"}, {"answer": "Banks Act directives do not lapse at year end; they remain effective until formally withdrawn in writing by the Prudential Authority under section 6(6)(c) of the Banks Act. [sarb_c1_2026_status_of_circulars, p.1]", "citations": [{"doc_id": "sarb_c1_2026_status_of_circulars", "page": 1, "section_ref": "para 370", "verified": true}], "closed_book": {"answer": "No. A directive issued under the Banks Act does not automatically lapse at year-end; it generally remains effective until it is withdrawn, revoked, replaced, or otherwise expires under its own terms, and a status circular is ordinarily informational rather than a condition of continued validity.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "correct", "support": null}}, "refused": false}, "evidence": [{"doc_id": "sarb_c1_2026_status_of_circulars", "page": 3, "quote": "all such issued directives will remain effective until such time as they are withdrawn in writing by the PA"}], "id": "t32", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "correct", "support": "supported"}}, "notices": [], "passages": [{"doc_id": "sarb_c1_2026_status_of_circulars", "pages": [1, 1], "section": "370 Helen Joseph Street  Pretoria  0002", "text": "+27 12 313 3911 / 0861 12 7272 www.resbank.co.za 1 Ref.: 15/8/1/1 C1/2026 To: All banks, branches of foreign institutions, controlling companies, eligible institutions and auditors of banks or controlling companies Circular issued in terms of section 6(4) of the Banks Act, 1990 (Act No. 94 of 1990) Status of previously issued circulars Executive summary To ensure that banks (including branches of foreign institutions), controlling companies, eligible institutions and auditors of banks or controlling companies are in no doubt as to which previously issued circulars remain effective, the Prudential Authority (PA) will annually confirm their status. Addressees should note that, contrary to the process whereby the status of circulars are confirmed annually, directives issued in terms of section 6(6) of the Banks Act, 1990 (Act No. 94 of 1990) (Banks Act) remain effective until they are formally withdrawn in writing by the PA in terms of section 6(6)(c) of the Banks Act. 1."}, {"doc_id": "sarb_c1_2026_status_of_circulars", "pages": [1, 1], "section": "370 Helen Joseph Street  Pretoria  0002", "text": "remain effective until they are formally withdrawn in writing by the pa in terms of section 6 ( 6 ) ( c ) of the banks act. 1. Introduction 1.1 All previously issued Banks Act circulars are deemed to be withdrawn, terminated or replaced, except if such a circular is to remain effective and is then accordingly confirmed in Circular 1 of that year. The circulars that remain effective will retain their original numbers and dates. 2. Effective circulars issued in terms of the Banks Act The circulars listed below remain effective. Accordingly, banks, controlling companies, eligible institutions and auditors of banks or controlling companies are requested to retain a copy of these circulars. Circular 2.1 Banks Act Circular 3/2013 effective maturity 2.2 Banks Act Circular 4/2013 Treatment of investments in banking, financial, securities, insurance and commercial entities"}, {"doc_id": "sarb_c1_2026_status_of_circulars", "pages": [1, 2], "section": "370 Helen Joseph Street  Pretoria  0002", "text": "act circular 3 / 2013 effective maturity 2. 2 banks act circular 4 / 2013 treatment of investments in banking, financial, securities, insurance and commercial entities 2 2.3 Banks Act Circular 5/2013 Reporting of items subject to thresholds that do not constitute a full deduction from qualifying capital and reserve funds 2.4 Banks Act Circular 2/2014 Interpretation of definition of default as outlined in regulation 67 of the Regulations relating to Banks 2.5 Banks Act Circular 7/2014 External auditors of newly acquired or established entities 2.6 Banks Act Circular 4/2015 Matters related to banks’ compliance with the prescribed requirements related to the liquidity coverage ratio (LCR) and high-quality liquid assets (HQLA) 2.7 Banks Act Circular 5/2015 Matters related to the use of support in a bank's credit risk rating process 2.8 Banks Act Circular 8/2015 Countercyclical capital buffer for South Africa based on the Basel III framework 2.9 Banks Act Circular 4/2016 Matters relating to the implementation of the capital conservation buffer"}], "question": "Do Banks Act directives lapse at year end unless the status circular confirms them?", "reference_answer": "No. Directives remain effective until the Prudential Authority formally withdraws them in writing.", "refusal_reason": null, "refused": false, "type": "status"}, {"answer": "A registrant must give at least five business days’ notice before the voluntary cancellation takes effect. [nca_act_34_2005, p.40]\n\nForm 7 applies to an applicant for credit bureau registration. [nca_regs_2006, p.10-11]", "citations": [{"doc_id": "nca_act_34_2005", "page": 40, "section_ref": "s 57", "verified": true}, {"doc_id": "nca_regs_2006", "page": 10, "section_ref": null, "verified": true}, {"doc_id": "nca_regs_2006", "page": 11, "section_ref": null, "verified": true}], "closed_book": {"answer": "A registrant must give the National Credit Regulator at least **20 business days’ written notice** to voluntarily cancel its registration. An applicant for credit bureau registration must use **Form 3**.", "judges": {"llama": {"correctness": "incorrect", "support": null}, "qwen": {"correctness": "incorrect", "support": null}}, "refused": false}, "evidence": [{"doc_id": "nca_act_34_2005", "page": 40, "quote": "specifying a date, at least five business days after the date of the notice, on which the cancellation is to take effect"}, {"doc_id": "nca_regs_2006", "page": 10, "quote": "Form 5, if applying for registration as a credit bureau"}], "id": "t33", "judges": {"llama": {"correctness": "partial", "support": "supported"}, "qwen": {"correctness": "partial", "support": "supported"}}, "notices": ["nca_regs_2006 is a dated historical snapshot that may not reflect later amendments as of 2026-09-24 (no corpus document confirms this; see the manifest's external source)."], "passages": [{"doc_id": "nca_act_34_2005", "pages": [40, 40], "section": "58A.   Additional requirements for cancellations.—(1)  A registrant who voluntarily requests that his or her", "text": "credit provider, survive any suspension or cancellation of its registration ; and a consumer under a credit agreement survive the cancellation of the credit provider ’ s registration. Credit Regulator written notice in the prescribed manner and form— stating the registrant’s intention to voluntarily cancel the registration; and specifying a date, at least five business days after the date of the notice, on which the cancellation is to take effect."}, {"doc_id": "nca_act_34_2005", "pages": [40, 40], "section": "58A.   Additional requirements for cancellations.—(1)  A registrant who voluntarily requests that his or her", "text": "registration be cancelled must— submit a notice in the prescribed manner and form, and an affidavit to the National Credit Regulator, stating— (i) the registrant’s intention to voluntarily cancel his or her registration; (ii) reasons for such cancellation; and (iii) the date on which the cancellation shall take effect; attach to the said notice proof that all the affected consumers, credit providers and all credit bureaux have been notified about the intended cancellation; and attach to the said notice the registration certificate issued to that registrant by the National Credit Regulator. (2)  A registrant whose registration has been cancelled in accordance with subsection (1) must, in the prescribed manner and form, submit an affidavit to the National Credit Regulator stating that the consumers referred to subsections (1) (b) have been transferred to another registrant chosen by the consumer."}, {"doc_id": "nca_act_34_2005", "pages": [40, 40], "section": "58A.   Additional requirements for cancellations.—(1)  A registrant who voluntarily requests that his or her", "text": "credit regulator stating that the consumers referred to subsections ( 1 ) ( b ) have been transferred to another registrant chosen by the consumer. (3)  A credit provider who voluntarily requests that his or her registration be cancelled shall, in the prescribed manner and form, submit a cancellation notice to the National Credit Regulator accompanied by— the registration certificate that was issued to that credit provider; and an affidavit from the accounting officer, auditor or authority of such credit provider, confirming that the registered activities have ceased. (4)  The Minister may prescribe the procedure for the hand over and transfer of records of consumers where the registrant ceases to operate for any reason, including cancellation of registration, lapsing of registration, death or incapacity. [S. 58A inserted by s. 20 of Act No. 19 of 2014.]"}, {"doc_id": "nca_act_34_2005", "pages": [39, 40], "section": "57.   Cancellation of registration.—(1)  Subject to subsection (2), a registration in terms of this Act may be", "text": "; and the date of cancellation. ( 6 ) if a registration is cancelled in terms of this section or section 58, the national credit regulator must — cancel the registration certificate; and amend the register accordingly. (7)  A registration is cancelled as of— the date on which the Tribunal issues an order, or in the case of a cancellation in terms of section 58, the date specified by the registrant in the notice of voluntary cancellation. (8)  A registrant whose registration has been cancelled must not engage in any formerly registered activities after the date on which the cancellation takes effect. (9)  The obligations of— a registrant under this Act, or under any credit agreement in respect of which it is the credit provider, survive any suspension or cancellation of its registration; and a consumer under a credit agreement survive the cancellation of the credit provider’s registration."}, {"doc_id": "nca_regs_2006", "pages": [10, 11], "section": "Form 7 to the applicant by hand or registered mail.", "text": "the act, within 15 business days after the request is delivered to the applicant. ( 2 ) ( 3 ) disqualification of natural persons from registration 5. whether alone or in conjunction with others, becomes disqualified fiom individual registration in terms of section 46(3) of the Act, that person must provide the National Credit Regulator and the registrant with notification by completing Form 6 and submitting it within 30 business days of becoming disqualified. No. 28864 13 Conditions of registration 6. rn applicant as contemplated in section 48(3) of the Act by delivering a notice contained in 8 Review of conditions of registration 7. A registrant may on application to the National Credit Regulator in terms of Secfion 49( l)(a) of the Act, apply for the review or variation of any condition of registration by submitting:"}], "question": "How much notice must a registrant give to cancel its registration voluntarily, and which form applies to an applicant for credit bureau registration?", "reference_answer": "The notice must specify a cancellation date at least five business days after the date of the notice. An applicant for registration as a credit bureau uses Form 5.", "refusal_reason": null, "refused": false, "type": "multi"}, {"answer": "A bank may not charge a complainant for using its complaints processes and procedures. [fsca_cs3_2020_banks, p.20]\n\nA bank must acknowledge a complaint within a reasonable time, explain the handling process, provide indicative timelines, and give details of internal escalation, review, and applicable ombud processes. [fsca_cs3_2020_banks, p.20]\n\nA complainant must be kept informed of the complaint’s progress, reasons for delays and revised timelines, and the bank’s decision. [fsca_cs3_2020_banks, p.20]\n\nIf a complaint is upheld, any promised compensation, goodwill payment, or other action must be carried out without undue delay and within agreed timeframes. [fsca_cs3_2020_banks, p.19]\n\nIf a complaint is rejected, the complainant must receive clear and adequate reasons and information about applicable escalation or review processes and time limits. [fsca_cs3_2020_banks, p.19]\n\nThe complaints process must not impose unreasonable barriers and must allow complaints to be considered after reasonable steps have been taken to gather and investigate relevant information and circumstances, with due regard to fair treatment. [fsca_cs3_2020_banks, p.16]", "citations": [{"doc_id": "fsca_cs3_2020_banks", "page": 20, "section_ref": null, "verified": true}, {"doc_id": "fsca_cs3_2020_banks", "page": 20, "section_ref": null, "verified": true}, {"doc_id": "fsca_cs3_2020_banks", "page": 20, "section_ref": null, "verified": true}, {"doc_id": "fsca_cs3_2020_banks", "page": 19, "section_ref": null, "verified": true}, {"doc_id": "fsca_cs3_2020_banks", "page": 19, "section_ref": null, "verified": true}, {"doc_id": "fsca_cs3_2020_banks", "page": 16, "section_ref": null, "verified": true}], "closed_book": {"answer": "A bank generally should not charge a complainant a fee merely for lodging or pursuing a complaint through its internal complaints process. Conduct standards typically require complaints procedures to be accessible, transparent and fair, with complaints handled objectively, resolved within reasonable or prescribed timeframes, and the outcome and any available escalation or redress clearly communicated.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "correct", "support": null}}, "refused": false}, "evidence": [{"doc_id": "fsca_cs3_2020_banks", "page": 20, "quote": "may not impose any charge for a complainant to make use of complaint processes and procedures"}, {"doc_id": "fsr_act_9_2017", "page": 120, "quote": "the resolution of complaints and disputes concerning those products and services, including redress"}], "id": "t34", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "correct", "support": "supported"}}, "notices": [], "passages": [{"doc_id": "fsca_cs3_2020_banks", "pages": [20, 20], "section": "", "text": "(16) Complaints information recorded in accordance with subsection (15) must be scrutinised and analysed by a bank on an ongoing basis and uillised to proactively identify and manage conduct risks and affect improved outcomes and processes for its financial customers, and to prevent recurrences of poor outcomes and errors. (17) Abank must establish and maintain appropriate processes and procedures for reporting of the information in subsection (16) to its governing body and appropriate key persons. (18) A bank must ensure that Its complaint processes and procedures are transparent, visible and accessible through channels that are appropriate to the bank and its financial customers. (19) Abank may not impose any charge for a complainant to make use of complaint processes and procedures. (20) All communications with a retait complainant must use plain language."}, {"doc_id": "fsca_cs3_2020_banks", "pages": [20, 20], "section": "", "text": "for a complainant to make use of complaint processes and procedures. ( 20 ) all communications with a retait complainant must use plain language. (21) A bank must, within a reasonable time after receipt of a complaint, acknowledge receipt thereof and promptly Inform a complainant of the process to be followed in handling the complaint, including - (a) contact details of the person or department that will be handling the complaint; (b) indicative timelines for addressing the complaint; (co) details of the internal complaints escalation and review process If the complainant Is not satisfied with the outcome of a complaint; and (dq) details of escalation of complaints to the office of a relevant ombud where applicable. (22) Acomplainant must be kept adequately informed of - (a) __ the progress of the complaint; (b) causes of any delay in the finalisation of the complaint and revised timelines; and (c) the bank's decision in response to the complaint. (23) Abank must - 20"}, {"doc_id": "fsca_cs3_2020_banks", "pages": [19, 19], "section": "", "text": "(11) | Procedures within the complaints escalation and review process must provide for internal escalation of complex or unusual complaints as well as the allocation to a person of appropriate seniority and expertise within the bank, which must form part of the complaint management framework required in subsection (3) above. (12) Where a complaint is upheld, any commitment by the bank to make a compensation payment, goodwill payment or to take any other action must be carried out without undue delay and within any agreed timeframes. (13) Where a complaint is rejected, the complainant must be provided with clear and adequate reasons for the decision and must be informed of any applicable escalation or review processes, Including how to use them and any relevant time limits."}, {"doc_id": "fsca_cs3_2020_banks", "pages": [16, 16], "section": "", "text": "(c) enables complaints to be considered after taking reasonable steps to gather and Investigate all relevant and appropriate information and circumstances, with due regard to the fair treatment of complainants; (a) does not Impose unreasonable barriers to complainants; and (e) must address and provide for, at least, the matters provided for In this section. (2) A bank must regularly review Its complaints management framework and document any changes thereto."}], "question": "Can a bank charge a complainant for using its complaints process, and what may conduct standards say about resolving complaints?", "reference_answer": "No. A bank may not impose any charge for a complainant to use its complaint processes. Conduct standards may also cover the resolution of complaints and disputes about products and services, including redress.", "refusal_reason": null, "refused": false, "type": "multi"}, {"answer": "IFRS 9 changed recognition of credit losses from IAS 39’s incurred-loss approach, which required a loss event before a provision was raised, to an expected-credit-loss model that incorporates forward-looking information and does not require a loss event to occur first. [sarb_d3_2023_accounting_provisions_ifrs9, p.1]\n\nThe banking regulator treats Stage 2 exposures as general provisions (GP) for regulatory purposes because they are not credit impaired under IFRS 9. [sarb_d3_2023_accounting_provisions_ifrs9, p.3]", "citations": [{"doc_id": "sarb_d3_2023_accounting_provisions_ifrs9", "page": 1, "section_ref": "para 370", "verified": true}, {"doc_id": "sarb_d3_2023_accounting_provisions_ifrs9", "page": 3, "section_ref": "para 3", "verified": true}], "closed_book": {"answer": "IFRS 9 replaced IAS 39’s “incurred-loss” model because it could delay recognition of deteriorating credit quality, adopting a forward-looking expected-credit-loss model that recognises losses earlier. Under the SARB’s prudential framework, a Stage 2 exposure—where credit risk has increased significantly since initial recognition—is generally not automatically treated as defaulted or non-performing, but it must carry a lifetime ECL provision and be closely monitored; default classification remains governed by prudential default criteria.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "correct", "support": null}}, "refused": false}, "evidence": [{"doc_id": "ifrs9_project_summary_2014", "page": 14, "quote": "so that it is no longer necessary for a trigger event to have occurred before credit losses are recognised"}, {"doc_id": "sarb_d3_2023_accounting_provisions_ifrs9", "page": 3, "quote": "Stage 2 exposures shall be treated as GP for regulatory purposes"}], "id": "t35", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "correct", "support": "supported"}}, "notices": [], "passages": [{"doc_id": "sarb_d3_2023_accounting_provisions_ifrs9", "pages": [1, 1], "section": "370 Helen Joseph Street  Pretoria  0002", "text": "( ias ) 39 was based on an incurred loss approach, ifrs 9 does not require a loss event to occur before a provision is raised. The expected credit loss (ECL) model required by IFRS 9, which takes into account forward-looking information, resulted in a significant increase in impairments raised by banks thereby affecting the available capital. The capital impact was managed through transitional arrangements. This Directive directs banks and auditors of banks regarding the classification of impairments as either general or specific under IFRS 9 post the conclusion of the transition period and replaces Directive 5/2017 issued in November 2017 1. Introduction 1.1 In July 2014, the IASB issued IFRS 9, which became effective for reporting periods commencing on or after 1 January 2018, replacing IAS 39, Financial Instruments: Classification and Measurement. 1.2 IFRS 9 fundamentally changed the way banks calculated provisions for credit losses/impairments given that IAS 39 impairments were based on an incurred loss model which required a loss event to occur prior to a provision being raised. Under"}, {"doc_id": "sarb_d3_2023_accounting_provisions_ifrs9", "pages": [3, 3], "section": "3 Reporting date in this directive refers to reporting prescribed in terms of regulation 7 of the Regulations", "text": "3 that are not credit impaired as defined by IFRS 9 requirements. As such, Stage 2 exposures shall be treated as GP for regulatory purposes. 2.1.3 determined that, at the reporting date, were credit impaired as defined by IFRS 9 requirements, that is, Stage 3 exposures, shall be treated as SP for regulatory purposes. 2.2 The provisions in respect of exposures in stages 1, 2 and 3 in terms of IFRS 9 shall be deducted from the exposure measure when calculating the leverage ratio in the form BA 700. 3. Acknowledgement of receipt 3.1 Kindly ensure that a copy of this Directive is made available to your institution’s external auditors. In addition, the attached acknowledgement of receipt, duly completed and signed by both the Chief Executive Officer of the institution and the said auditors, should be returned to the PA at the earliest convenience of the signatories. Fundi Tshazibana Chief Executive Officer Date: The previous Directive issued was Directive 2/2023, dated 22 February 2023. 17/05/23"}], "question": "Why did IFRS 9 change when credit losses are recognised, and how does the banking regulator treat Stage 2 exposures?", "reference_answer": "IFRS 9 removed the need for a trigger event before credit losses are recognised. The regulator treats Stage 2 exposures as general provisions for regulatory purposes.", "refusal_reason": null, "refused": false, "type": "multi"}, {"answer": "The derivatives conduct standard requires providers to manage conflicts of interest fairly between themselves and their clients and counterparties. [fsca_conduct_standard_otc_derivatives_2018, p.2-3]\n\nThe Retail Distribution Review addresses conflicts through structural interventions, including limitations on intermediary remuneration and restrictions on who may pay it. [fsca_rdr_2014, p.3]\n\nThe Retail Distribution Review also identifies commission-sharing, commission-splitting, and platform-fee and rebate arrangements as potential sources of conflicts requiring attention. [fsca_rdr_2014, p.61]", "citations": [{"doc_id": "fsca_conduct_standard_otc_derivatives_2018", "page": 2, "section_ref": "para 3", "verified": true}, {"doc_id": "fsca_conduct_standard_otc_derivatives_2018", "page": 3, "section_ref": "para 3", "verified": true}, {"doc_id": "fsca_rdr_2014", "page": 3, "section_ref": null, "verified": true}, {"doc_id": "fsca_rdr_2014", "page": 61, "section_ref": "para 4.3.4", "verified": true}], "closed_book": {"answer": "The **Derivatives Conduct Standard** requires regulated firms to identify, prevent or manage conflicts of interest in the provision of derivatives services—supported by governance, policies, controls and, where appropriate, disclosure—so that clients are treated fairly.  \nThe **Retail Distribution Review (RDR)** addresses conflicts mainly in retail product distribution, particularly those created by commission, incentives, product-provider influence and conflicted remuneration, proposing clearer adviser roles, more transparent charging and remuneration structures aligned with customers’ interests.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "correct", "support": null}}, "refused": false}, "evidence": [{"doc_id": "fsca_conduct_standard_otc_derivatives_2018", "page": 3, "quote": "at all times manage conflicts of interest fairly, both between itself and its clients and counterparties"}, {"doc_id": "fsca_rdr_2014", "page": 6, "quote": "Intermediary remuneration should not contribute to conflicts of interest that may undermine suitable product advice and fair outcomes for customers"}], "id": "t36", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "correct", "support": "supported"}}, "notices": ["fsca_conduct_standard_otc_derivatives_2018 is a consultation document, not a final published instrument.", "fsca_conduct_standard_otc_derivatives_2018 is of unconfirmed current status as of 2026-09-08 (no corpus document confirms this; see the manifest's external source).", "fsca_rdr_2014 is a consultation document, not a final published instrument.", "fsca_rdr_2014 is a dated historical snapshot that may not reflect later amendments as of 2026-09-08 (no corpus document confirms this; see the manifest's external source)."], "passages": [{"doc_id": "fsca_conduct_standard_otc_derivatives_2018", "pages": [2, 3], "section": "3. General principles of the conduct standard", "text": "the fma regulations for the purposes of this conduct standard, the term “ provider ” has the same meaning as “ authorised otc derivative provider ”. This conduct standard is binding on providers. A provider must – at all times act honestly, fairly, with due skill, care and diligence, and in the interests of clients and counterparties and the integrity of the financial markets; Page 3 of 13 communicate information to clients and counterparties in a way which is clear, fair and not misleading; at all times manage conflicts of interest fairly, both between itself and its clients and counterparties; observe proper standards of market conduct; (e) conduct itself in such a manner that does not impede the objects of the Act; (f) maintain knowledge of and comply with all applicable laws, rules and regulations governing its activities; and (g) engage with the Authority in an open and cooperative way, and must disclose to the Authority appropriately any material incidence of non-compliance with the Act or material operational failure relating to the provider. and cooperative way, and must disclose to the authority appropriately any material incidence of non - compliance with the act or material operational failure relating to the provider."}, {"doc_id": "fsca_rdr_2014", "pages": [3, 3], "section": "EXECUTIVE SUMMARY", "text": "This paper outlines the results of the Retail Distribution Review (RDR) carried out by the Financial Services Board (FSB) and proposes farreaching reforms to the regulatory framework for distributing retail financial products to customers in South Africa. The review was undertaken in response to the fact that, despite the significant progress achieved through the Financial Advisory and Intermediary Services (FAIS) Act in raising intermediary professionalism, improving disclosure to clients and mitigating certain conflicts of interest, significant concerns about poor customer outcomes and mis-selling of financial products remain. This paper outlines a number of key risks inherent in the current distribution landscape, including distribution relationships and intermediary remuneration models that contribute to poor outcomes and mis-selling, and puts forward a number of proposals aimed at addressing these risks. The review outlines a more proactive and interventionist regulatory approach; it proposes a shift away from a purely rules-based compliance approach to one that also sees the introduction of a set of structural interventions designed to change incentives, relationships and business models in the market in a way that supports the consistent delivery of fair outcomes to customers."}, {"doc_id": "fsca_rdr_2014", "pages": [3, 3], "section": "EXECUTIVE SUMMARY", "text": "set of structural interventions designed to change incentives, relationships and business models in the market in a way that supports the consistent delivery of fair outcomes to customers. Key structural changes include placing greater responsibility on product suppliers for ensuring the delivery of fair customer outcomes through their chosen distribution channel; limitations on the types of remuneration that intermediaries can earn and from whom, designed to address conflicts of interest; and enabling customers to understand and compare the nature, value and cost of advice and other services that intermediaries provide. These changes should also support the development of more competitive markets and the development of more transparent and fair products. The RDR proposals seek to give retail customers confidence in the retail financial services market and trust that product suppliers and advisers will treat them fairly. This in turn will support a more sustainable market for financial advice and financial services over the longer term. Background and objectives The review has been undertaken against the background of a new approach to regulating market conduct in the financial sector. Under a “Twin Peaks” approach, that will separate prudential and market conduct regulation of the sector, market conduct regulation and supervision is informed by the Treating Customers Fairly (TCF) framework."}, {"doc_id": "fsca_rdr_2014", "pages": [61, 61], "section": "4.3.4. Remuneration for services connecting product suppliers and customers – direct non-advice sales execution;", "text": "address potential conflicts of interest arising from so - called “ commission sharing ” or “ commission splitting ” arrangements between intermediaries and / or product suppliers. In addition, a specific review of the remuneration models used by commercial product comparison and aggregation providers will be undertaken, to ensure that remuneration is reasonable and commensurate to the actual services rendered, transparent to customers and not conflicted. O Investment platform administration As outlined in 3.1.4, the current practice of investment platform administration services being remunerated by means of a platform fee and rebates negotiated with, and paid by, the product supplier presents various risks with respect to conflicts of interest, complexity of charging structures and ultimately a reduction in effective competition, to the detriment of consumers. presents various risks with respect to conflicts of interest, complexity of charging structures and ultimately a reduction in effective competition, to the detriment of consumers."}], "question": "How do the derivatives conduct standard and the retail distribution review each deal with conflicts of interest?", "reference_answer": "A derivatives provider must manage conflicts of interest fairly between itself and its clients and counterparties. The review says intermediary remuneration should not contribute to conflicts of interest that undermine suitable advice and fair outcomes.", "refusal_reason": null, "refused": false, "type": "multi"}, {"answer": "A person may challenge the accuracy of information held by a credit bureau, after which the credit bureau must take reasonable steps to seek supporting evidence and either provide credible evidence to the person or remove the information and all records of it if credible evidence cannot be found. [nca_act_34_2005, p.50]  \nWithin 20 business days after receiving a copy of the evidence, the person may apply in the prescribed manner and form to the National Credit Regulator to investigate the disputed information as a complaint under section 136. [nca_act_34_2005, p.50]  \nA credit bureau or the National Credit Register may not report challenged information until the challenge has been resolved. [nca_act_34_2005, p.50]", "citations": [{"doc_id": "nca_act_34_2005", "page": 50, "section_ref": "s 72", "verified": true}, {"doc_id": "nca_act_34_2005", "page": 50, "section_ref": "s 72", "verified": true}, {"doc_id": "nca_act_34_2005", "page": 50, "section_ref": "s 72", "verified": true}], "closed_book": {"answer": "Under the National Credit Act, dispute the information in writing with the credit bureau, request a free copy of your credit record, and provide supporting documents; the bureau must flag and investigate the entry and resolve the dispute within 20 business days, correcting or removing information it cannot verify.  \nIf it is not resolved, lodge a complaint with the National Credit Regulator (NCR), using the prescribed complaint form and attaching your identity document, credit report, written dispute, the bureau’s response (or proof of no response), and supporting evidence.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "partial", "support": null}}, "refused": false}, "evidence": [{"doc_id": "nca_act_34_2005", "page": 50, "quote": "challenge the accuracy of any information concerning that person"}, {"doc_id": "ncr_guideline_disputed_credit_complaints", "page": 2, "quote": "individuals who have challenged information held by credit providers or credit bureaus are entitled to submit a complaint"}], "id": "t37", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "partial", "support": "supported"}}, "notices": [], "passages": [{"doc_id": "nca_act_34_2005", "pages": [50, 50], "section": "72.   Right to access and challenge credit records and information
