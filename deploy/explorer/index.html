.—(1)  Every person has a right to—", "text": "record of it, from its files, if it is unable to find credible evidence in support of the information, subject to subsection ( 6 ). (4)  Within 20 business days after receiving a copy of evidence in terms of subsection (3) (a), the person who challenged the information held by a credit provider, credit bureau or national credit register may apply in the prescribed manner and form to the National Credit Regulator to investigate the disputed information as a complaint under section 136. (5)  A credit bureau or the National Credit Register may not report information that is challenged until the challenge has been resolved in terms of subsection (3) (a) or (b). (6)  On application by a credit provider, credit bureau or the National Credit Regulator, as the case may be, the Tribunal may make an order limiting the applicant’s obligations to a consumer in terms of this section if the Tribunal is satisfied that the consumer’s— particular request or requirement is frivolous, unfounded or wholly unreasonable; or history and pattern of such requests or requirements are frivolous or vexatious."}], "question": "What may a person do about inaccurate information held by a credit bureau, and how do they take a disputed-information complaint to the regulator?", "reference_answer": "They may challenge the accuracy of the information. A person who has challenged information may then submit a complaint in the prescribed manner and form to the National Credit Regulator.", "refusal_reason": null, "refused": false, "type": "multi"}, {"answer": null, "citations": [], "closed_book": {"answer": "Under the National Credit Act, a document is in plain language if an ordinary consumer in the intended class, with average literacy and minimal credit experience, could reasonably understand its content, significance and effect without undue effort. A bank must ensure that its complaint procedures are easily accessible, clearly publicised and free or low-cost for customers to use.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "correct", "support": null}}, "refused": false}, "evidence": [{"doc_id": "nca_notebook_brochure", "page": 12, "quote": "with average literacy skills and minimal credit experience"}, {"doc_id": "fsca_cs3_2020_banks", "page": 20, "quote": "processes and procedures are transparent, visible and accessible through channels that are appropriate"}], "id": "t38", "judges": {"llama": {"correctness": "refused", "support": null}, "qwen": {"correctness": "refused", "support": null}}, "notices": [], "passages": [], "question": "How does the credit statute test whether a document is in plain language, and what must a bank ensure about how accessible its complaint processes are?", "reference_answer": "A document is in plain language if an ordinary consumer with average literacy skills and minimal credit experience could be expected to understand it without undue effort. A bank must make its complaint processes and procedures transparent, visible and accessible through appropriate channels.", "refusal_reason": "model_refusal", "refused": true, "type": "multi"}, {"answer": "IFRS 9 applies to reporting periods commencing on or after 1 January 2018. [sarb_d3_2023_accounting_provisions_ifrs9, p.1]  \nWhen determining impairments, entities must take into account all information available without undue cost or effort, including forward-looking information. [sarb_d3_2023_accounting_provisions_ifrs9, p.2]", "citations": [{"doc_id": "sarb_d3_2023_accounting_provisions_ifrs9", "page": 1, "section_ref": "para 370", "verified": true}, {"doc_id": "sarb_d3_2023_accounting_provisions_ifrs9", "page": 2, "section_ref": "para 370", "verified": true}], "closed_book": {"answer": "IFRS 9 applies to annual periods beginning on or after 1 January 2018. In determining impairment, entities must consider all reasonable and supportable information available without undue cost or effort, including historical experience, current conditions, and forecasts of future economic conditions.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "correct", "support": null}}, "refused": false}, "evidence": [{"doc_id": "ifrs9_project_summary_2014", "page": 3, "quote": "IFRS 9 is effective for annual periods beginning on or after 1 January 2018"}, {"doc_id": "sarb_d3_2023_accounting_provisions_ifrs9", "page": 2, "quote": "IFRS 9 requires entities to take into account all information that is available without undue cost or effort"}], "id": "t39", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "correct", "support": "supported"}}, "notices": [], "passages": [{"doc_id": "sarb_d3_2023_accounting_provisions_ifrs9", "pages": [1, 1], "section": "370 Helen Joseph Street  Pretoria  0002", "text": "( ias ) 39 was based on an incurred loss approach, ifrs 9 does not require a loss event to occur before a provision is raised. The expected credit loss (ECL) model required by IFRS 9, which takes into account forward-looking information, resulted in a significant increase in impairments raised by banks thereby affecting the available capital. The capital impact was managed through transitional arrangements. This Directive directs banks and auditors of banks regarding the classification of impairments as either general or specific under IFRS 9 post the conclusion of the transition period and replaces Directive 5/2017 issued in November 2017 1. Introduction 1.1 In July 2014, the IASB issued IFRS 9, which became effective for reporting periods commencing on or after 1 January 2018, replacing IAS 39, Financial Instruments: Classification and Measurement. 1.2 IFRS 9 fundamentally changed the way banks calculated provisions for credit losses/impairments given that IAS 39 impairments were based on an incurred loss model which required a loss event to occur prior to a provision being raised. Under"}, {"doc_id": "sarb_d3_2023_accounting_provisions_ifrs9", "pages": [2, 2], "section": "370 Helen Joseph Street  Pretoria  0002", "text": "2 IAS 39, losses expected because of future events, no matter how likely, were not recognised.1 1.3 IFRS 9 requires entities to take into account all information that is available without undue cost or effort, including that which is forward-looking when determining impairments to be raised, effectively introducing the concept of ECL for financial reporting purposes. 1.4 The move to an ECL accounting framework was an important step towards resolving weaknesses identified during the global financial crisis and was aligned with the April 2009 call by the Group of Twenty leaders for accounting standard setters to “strengthen accounting recognition of loan loss provisions by incorporating a broader range of credit information”2. 1.5 At the time of transitioning to IFRS 9, it was important for regulatory purposes to define which provisions should be regarded as specific provisions (SP) and general provisions (GP)."}], "question": "From when does IFRS 9 apply, and what information must entities take into account when determining impairments, as the banking regulator summarises it?", "reference_answer": "IFRS 9 applies to annual periods beginning on or after 1 January 2018. Entities must take into account all information available without undue cost or effort, including forward-looking information.", "refusal_reason": null, "refused": false, "type": "multi"}, {"answer": "The FSCA published the conduct standard for banks on 8 July 2020. [fsca_press_conduct_standard_banks_2020, p.1]\n\nA bank must scrutinise and analyse complaint information on an ongoing basis, use it to identify and manage conduct risks and improve customer outcomes and processes, report it to its governing body and appropriate key persons, and ensure that its complaint processes are transparent, accessible, free of charge, and communicated to retail complainants in plain language. [fsca_cs3_2020_banks, p.20]", "citations": [{"doc_id": "fsca_press_conduct_standard_banks_2020", "page": 1, "section_ref": null, "verified": true}, {"doc_id": "fsca_cs3_2020_banks", "page": 20, "section_ref": null, "verified": true}], "closed_book": {"answer": "The FSCA published the Conduct Standard for Banks (FSCA 3 of 2020) on 27 November 2020. When a bank receives a complaint, it must acknowledge, record and investigate it, communicate the outcome within a reasonable period, and inform the complainant of available escalation or ombud avenues if unresolved.", "judges": {"llama": {"correctness": "incorrect", "support": null}, "qwen": {"correctness": "incorrect", "support": null}}, "refused": false}, "evidence": [{"doc_id": "fsca_press_conduct_standard_banks_2020", "page": 1, "quote": "FSCA Press Release 08 July 2020 FSCA publishes the conduct standard for banks"}, {"doc_id": "fsca_cs3_2020_banks", "page": 20, "quote": "within a reasonable time after receipt of a complaint, acknowledge receipt thereof and promptly"}], "id": "t40", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "partial", "support": "supported"}}, "notices": [], "passages": [{"doc_id": "fsca_press_conduct_standard_banks_2020", "pages": [1, 1], "section": "", "text": "Transitional Management Committee: AM Sithole (Commissioner)    DP Tshidi    CD da Silva    JA Boyd     MM du Toit    LP Kekana   K Gibson     OB Makhubela    P Mogase FSCA Press Release 08 July 2020 FSCA publishes the conduct standard for banks The Financial Sector Conduct Authority (FSCA) has published the conduct standard for banks along with a document detailing the expected impact of the conduct standard, and a report on the consultation process. The publication of these documents is the first step towards rolling out a comprehensive market conduct regulatory framework for the banking sector. When the Financial Sector Regulation Act (FSRA) was introduced in 2018, the FSCA was given the explicit mandate of regulating and supervising the way banking institutions conduct themselves in relation to the provision of financial products and services to customers. As part of fulfilling this mandate, and considering various risks identified in the sector, the FSCA developed the conduct standard which enables it to supervise banks. The conduct standard underwent a comprehensive public consultation process, coupled with industry specific engagements. It was also submitted to Parliament as required in terms of section 103 of the FSRA."}, {"doc_id": "fsca_cs3_2020_banks", "pages": [20, 20], "section": "", "text": "(16) Complaints information recorded in accordance with subsection (15) must be scrutinised and analysed by a bank on an ongoing basis and uillised to proactively identify and manage conduct risks and affect improved outcomes and processes for its financial customers, and to prevent recurrences of poor outcomes and errors. (17) Abank must establish and maintain appropriate processes and procedures for reporting of the information in subsection (16) to its governing body and appropriate key persons. (18) A bank must ensure that Its complaint processes and procedures are transparent, visible and accessible through channels that are appropriate to the bank and its financial customers. (19) Abank may not impose any charge for a complainant to make use of complaint processes and procedures. (20) All communications with a retait complainant must use plain language."}], "question": "When did the conduct regulator publish the conduct standard for banks, and what must a bank do when it receives a complaint?", "reference_answer": "The FSCA published it on 8 July 2020. A bank must acknowledge receipt of a complaint and promptly tell the complainant the process to be followed.", "refusal_reason": null, "refused": false, "type": "multi"}, {"answer": null, "citations": [], "closed_book": {"answer": "A debt counsellor applies for registration using **Form 16**. A payment distribution agent must deposit the monies collected into a **separate trust account at a bank registered under the Banks Act**, distinct from its own funds.", "judges": {"llama": {"correctness": "incorrect", "support": null}, "qwen": {"correctness": "incorrect", "support": null}}, "refused": false}, "evidence": [{"doc_id": "nca_regs_2006", "page": 10, "quote": "Form 4, if applying for registration as a debt counsellor"}, {"doc_id": "nca_affordability_regs_2015", "page": 8, "quote": "deposit monies collected from consumers into a trust account opened at a registered bank"}], "id": "t41", "judges": {"llama": {"correctness": "refused", "support": null}, "qwen": {"correctness": "refused", "support": null}}, "notices": [], "passages": [], "question": "Which form does a debt counsellor use to apply for registration, and where must a payment distribution agent deposit the monies it collects?", "reference_answer": "A debt counsellor applies on Form 4. A payment distribution agent must deposit collected monies into a trust account opened at a registered bank.", "refusal_reason": "model_refusal", "refused": true, "type": "multi"}, {"answer": null, "citations": [], "closed_book": {"answer": "According to the 2004 circular, the Basel II text was due to be published by the end of June 2004. The Basel Committee issued its principles for operational resilience on 31 March 2021.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "correct", "support": null}}, "refused": false}, "evidence": [{"doc_id": "sarb_circular_6_2004_basel_ii_update", "page": 1, "quote": "will publish the text of Basel II at the end of June 2004"}, {"doc_id": "sarb_d10_2021_operational_resilience", "page": 1, "quote": "In March 2021 the Basel Committee on Banking Supervision (BCBS) issued a paper on principles for operational resilience"}], "id": "t42", "judges": {"llama": {"correctness": "refused", "support": null}, "qwen": {"correctness": "refused", "support": null}}, "notices": [], "passages": [], "question": "When was the text of Basel II due to be published according to the 2004 circular, and when did the Basel Committee issue its operational resilience principles?", "reference_answer": "The Basel Committee confirmed it would publish the Basel II text at the end of June 2004. It issued its paper on principles for operational resilience in March 2021.", "refusal_reason": "model_refusal", "refused": true, "type": "multi"}, {"answer": "The FSB’s Treating Customers Fairly (TCF) framework was intended to form part of the market-conduct “peak” in the Twin Peaks model. [fsca_tcf_2011, p.1-4]\n\nTCF was intended to complement sector-specific conduct regulation and require firms to demonstrate fair treatment throughout the product life cycle and across the value chain. [fsca_tcf_2011, p.1-4]\n\nThe proposed framework would embed an obligation to deliver TCF outcomes in legislation, making financial institutions accountable not only for complying with specific conduct standards but also for conducting business in a way that does not risk those outcomes. [fsca_rdr_2014, p.65]\n\nConduct standards were envisaged as a consistent and comprehensive set of principles and standards applying to the business conduct of financial institutions supervised by the market-conduct regulator, with responsibility for fair customer outcomes clearly identified. [fsca_rdr_2014, p.65]", "citations": [{"doc_id": "fsca_tcf_2011", "page": 1, "section_ref": "para 6", "verified": true}, {"doc_id": "fsca_tcf_2011", "page": 2, "section_ref": "para 6", "verified": true}, {"doc_id": "fsca_tcf_2011", "page": 3, "section_ref": "para 6", "verified": true}, {"doc_id": "fsca_tcf_2011", "page": 4, "section_ref": "para 6", "verified": true}, {"doc_id": "fsca_tcf_2011", "page": 1, "section_ref": "para 6", "verified": true}, {"doc_id": "fsca_tcf_2011", "page": 2, "section_ref": "para 6", "verified": true}, {"doc_id": "fsca_tcf_2011", "page": 3, "section_ref": "para 6", "verified": true}, {"doc_id": "fsca_tcf_2011", "page": 4, "section_ref": "para 6", "verified": true}, {"doc_id": "fsca_rdr_2014", "page": 65, "section_ref": "para 5.1", "verified": true}, {"doc_id": "fsca_rdr_2014", "page": 65, "section_ref": "para 5.1", "verified": true}], "closed_book": {"answer": "The FSB’s Treating Customers Fairly (TCF) programme was conceived as the market-conduct foundation of Twin Peaks, to be embedded in binding conduct legislation, standards and supervision rather than operate as a stand-alone code. Conduct standards may therefore require firms to design and target suitable products, provide clear information and suitable advice, deliver promised performance and service, avoid unreasonable post-sale barriers, and maintain effective complaints and redress processes.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "correct", "support": null}}, "refused": false}, "evidence": [{"doc_id": "fsca_tcf_2011", "page": 3, "quote": "TCF will form part of the market conduct peak in the Twin Peaks model"}, {"doc_id": "fsr_act_9_2017", "page": 120, "quote": "requirements for the fair treatment of financial customers, including in relation to"}], "id": "t43", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "correct", "support": "supported"}}, "notices": ["fsca_rdr_2014 is a consultation document, not a final published instrument.", "fsca_rdr_2014 is a dated historical snapshot that may not reflect later amendments as of 2026-09-08 (no corpus document confirms this; see the manifest's external source).", "fsca_tcf_2011 is a dated historical snapshot that may not reflect later amendments as of 2026-09-08 (no corpus document confirms this; see the manifest's external source)."], "passages": [{"doc_id": "fsca_tcf_2011", "pages": [1, 4], "section": "6 fairness outcomes  - throughout the product", "text": "Leanne Jackson Head: Treating Customers Fairly Insurance Regulatory Seminar Page 2 ●TCF will form part of the market conduct “peak” in the Twin Peaks model ●TCF Regulatory Framework SC feeds stakeholder input into broader regulatory reform process ●Final legislative framework is work in progress – TCF to be included in overarching market conduct principles ●TCF framework will complement sector specific conduct regulation of all affected entities (including banks) Page 3 ●TCF will require demonstrable delivery of the life cycle and across the value chain ●TCF regulatory framework will be a mix of principles and rules designed to best deliver these outcomes ●Firms will need to embed a TCF culture at all levels, supported by governance and MI ●The FSB will need a pre-emptive, intensive supervisory approach – with credible and visible enforcement Page 4"}, {"doc_id": "fsca_rdr_2014", "pages": [65, 65], "section": "5.1. RDR and the broader Twin Peaks framework", "text": "The proposals outlined in Chapter 4 entail structural changes to intermediary relationships and remuneration and will require extensive amendments to the regulatory framework. These changes will form part of a broader review of the legislative architecture necessary to give effect to a Twin Peaks regulatory model. In particular, the legislative architecture applicable to the new market conduct regulator will be designed to entrench and give effect to the TCF approach. At a high level, this will involve: O Embedding the obligation to deliver TCF outcomes into legislation, so as to hold financial institutions accountable not only for compliance with specific conduct standards, but also for conducting their business in a manner that does not pose risk to the delivery of these outcomes; O Ensuring that a consistent and comprehensive set of principles and standards applies to the conduct of business of all financial institutions supervised by the market conduct regulator, regardless of sector – possibly given effect to through a consolidated and overarching Act71 covering all regulatory requirements for conduct of all regulated financial services business; and O Clearly identifying the responsibility and accountability for delivery of fair customer outcomes of different parties under different circumstances."}], "question": "How did the fair-treatment programme of the financial services board see its place in Twin Peaks, and what may conduct standards require on fair treatment of customers?", "reference_answer": "It expected treating customers fairly to form part of the market conduct peak of the Twin Peaks model. Conduct standards may set requirements for the fair treatment of financial customers.", "refusal_reason": null, "refused": false, "type": "multi"}, {"answer": "Remuneration for outsourced insurance activities should be reasonable and commensurate with the actual function or activity outsourced, should not remunerate a function again where commission or a binder fee is payable, and should not increase the risk of unfair treatment of policyholders. [fsca_rdr_2014, p.22]\n\nIn 2018, the maximum binder fees an insurer could pay to a non-mandated intermediary authorised to render advice were capped per function performed, with the total not exceeding 9% of applicable premiums if all binder functions were performed. [fsca_rdr_intermediary_segmentation_2019, p.3]", "citations": [{"doc_id": "fsca_rdr_2014", "page": 22, "section_ref": "para 2.4.9", "verified": true}, {"doc_id": "fsca_rdr_intermediary_segmentation_2019", "page": 3, "section_ref": "para 2.7", "verified": true}], "closed_book": {"answer": "The Retail Distribution Review said intermediary remuneration should be **reasonable and commensurate with the actual services provided**, rather than excessive or driven by conflicted incentives. From 2018, insurer binder fees were subject to a **9% cap of the relevant premium**.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "correct", "support": null}}, "refused": false}, "evidence": [{"doc_id": "fsca_rdr_2014", "page": 6, "quote": "All remuneration must be reasonable and commensurate with the actual services rendered"}, {"doc_id": "fsca_rdr_intermediary_segmentation_2019", "page": 3, "quote": "The capping of the maximum binder fees that an insurer may pay to a non-mandated intermediary"}], "id": "t44", "judges": {"llama": {"correctness": "partial", "support": "supported"}, "qwen": {"correctness": "partial", "support": "supported"}}, "notices": ["fsca_rdr_2014 is a consultation document, not a final published instrument.", "fsca_rdr_2014 is a dated historical snapshot that may not reflect later amendments as of 2026-09-08 (no corpus document confirms this; see the manifest's external source).", "fsca_rdr_intermediary_segmentation_2019 is of unconfirmed current status as of 2026-09-08 (no corpus document confirms this; see the manifest's external source)."], "passages": [{"doc_id": "fsca_rdr_2014", "pages": [22, 22], "section": "2.4.9. Outsource service fees", "text": "in the binder agreement. ( also see 2. 2. 10 and 2. 3. 4 above for further details on binder arrangements. ) As these services are carried out for and on behalf of a product supplier, they are generally remunerated by means of a fee negotiated with the product supplier. In most cases, the level of these fees is not subject to regulation, although where the service constitutes an “intermediary services” for FAIS purposes it is subject to certain requirements. Remuneration paid in respect of the outsourcing of insurance activities is subject to Directive 159 it must – O be reasonable and commensurate with the actual function or activity outsourced O not result in any function or activity in respect of which commission or a binder fee is payable being remunerated again O not be structured in a manner that may increase the risk of unfair treatment of policyholders, and O not be linked to the monetary value of insurance claims repudiated, paid, not paid or partially paid. The above principles also apply to any sub-outsourcing."}, {"doc_id": "fsca_rdr_intermediary_segmentation_2019", "pages": [3, 3], "section": "2.7 In 2018, the following significant regulatory developments took effect in respect of certain", "text": ". the fsca would like to convey its appreciation to all the commentators for the level of engagement and the quality of information and comments that it received. distribution and outsourcing activities related to long and short-term policies: The capping of the maximum binder fees that an insurer may pay to a non-mandated intermediary (NMI) that is authorised to render advice, at a certain maximum per function performed, the total of which cannot exceed 9% of applicable premiums if all binder functions are performed;1 The introduction of an insurer notification process to the FSCA in respect of - o any arrangements where an insurer intends to pay remuneration to an independent intermediary or representative for a function other than services as intermediary or a binder function, including any other outsourcing arrangements;2 o any new binder arrangements that the insurer aims to enter into;3 and"}], "question": "What did the retail distribution review say about the reasonableness of intermediary remuneration, and which cap on insurer binder fees took effect in 2018?", "reference_answer": "All remuneration must be reasonable and commensurate with the services rendered. In 2018 the maximum binder fees an insurer may pay a non-mandated intermediary were capped.", "refusal_reason": null, "refused": false, "type": "multi"}, {"answer": null, "citations": [], "closed_book": {"answer": "A consumer who signs up for a credit card by telephone generally has **five business days** to terminate the credit agreement under section 121 of South Africa’s National Credit Act. The notice must be given to the credit provider within that period.", "judges": {"llama": {"correctness": "answered_unanswerable", "support": null}, "qwen": {"correctness": "answered_unanswerable", "support": null}}, "refused": false}, "evidence": [], "id": "t45", "judges": {"llama": {"correctness": "refused", "support": null}, "qwen": {"correctness": "refused", "support": null}}, "notices": [], "passages": [], "question": "What cooling-off period applies after a consumer signs up for a credit card over the telephone?", "reference_answer": "", "refusal_reason": "model_refusal", "refused": true, "type": "unanswerable"}, {"answer": null, "citations": [], "closed_book": {"answer": "Under the FAIS Act, crypto-asset service providers that give advice or perform intermediary services must generally be licensed as financial services providers and comply with the FAIS General Code of Conduct. This requires them to act honestly, fairly, professionally and with due skill, care and diligence; provide clear, timely and non-misleading disclosures (including risks, fees and conflicts); assess client needs and suitability, keep appropriate records, and maintain complaint-handling procedures. They must also meet FAIS fit-and-proper, supervision, conflict-management and reporting requirements applicable to their licence category.", "judges": {"llama": {"correctness": "answered_unanswerable", "support": null}, "qwen": {"correctness": "answered_unanswerable", "support": null}}, "refused": false}, "evidence": [], "id": "t46", "judges": {"llama": {"correctness": "refused", "support": null}, "qwen": {"correctness": "refused", "support": null}}, "notices": [], "passages": [], "question": "What conduct requirements apply to crypto-asset service providers under the financial advisory statute?", "reference_answer": "", "refusal_reason": "model_refusal", "refused": true, "type": "unanswerable"}, {"answer": null, "citations": [], "closed_book": {"answer": "South Africa’s monetary policy inflation target range is **3% to 6%**, with a **4.5% midpoint**.", "judges": {"llama": {"correctness": "answered_unanswerable", "support": null}, "qwen": {"correctness": "answered_unanswerable", "support": null}}, "refused": false}, "evidence": [], "id": "t47", "judges": {"llama": {"correctness": "refused", "support": null}, "qwen": {"correctness": "refused", "support": null}}, "notices": [], "passages": [], "question": "What inflation target range do South African banks and their regulators cite for monetary policy?", "reference_answer": "", "refusal_reason": "model_refusal", "refused": true, "type": "unanswerable"}, {"answer": null, "citations": [], "closed_book": {"answer": "If the shares were held as a capital investment, the capital gain is generally the selling proceeds less the shares’ base cost (including eligible acquisition and disposal costs); if held for trading, the profit is usually taxed as ordinary income instead. For an individual, 40% of the net annual capital gain—after allowable capital losses and the annual exclusion—is included in taxable income and taxed at the person’s marginal rate; companies generally use an 80% inclusion rate. Bank shares do not ordinarily attract a special capital-gains-tax calculation merely because the issuer is a bank.", "judges": {"llama": {"correctness": "answered_unanswerable", "support": null}, "qwen": {"correctness": "answered_unanswerable", "support": null}}, "refused": false}, "evidence": [], "id": "t48", "judges": {"llama": {"correctness": "refused", "support": null}, "qwen": {"correctness": "refused", "support": null}}, "notices": [], "passages": [], "question": "How is capital gains tax worked out when a shareholder sells shares in a bank?", "reference_answer": "", "refusal_reason": "model_refusal", "refused": true, "type": "unanswerable"}, {"answer": null, "citations": [], "closed_book": {"answer": "South Africa currently has no legally mandated open-banking data standard or accreditation framework that banks must meet. Any data sharing must nevertheless comply with laws such as POPIA, including informed customer consent, purpose limitation, data minimisation, security safeguards and accountable third-party processing.", "judges": {"llama": {"correctness": "answered_unanswerable", "support": null}, "qwen": {"correctness": "answered_unanswerable", "support": null}}, "refused": false}, "evidence": [], "id": "t49", "judges": {"llama": {"correctness": "refused", "support": null}, "qwen": {"correctness": "refused", "support": null}}, "notices": [], "passages": [], "question": "What data-sharing standards must banks meet to take part in open banking?", "reference_answer": "", "refusal_reason": "model_refusal", "refused": true, "type": "unanswerable"}, {"answer": "A credit provider must take reasonable steps to assess the prospective consumer’s understanding of the risks and costs, debt-repayment history, existing financial means, prospects and obligations before entering into the credit agreement. [nca_act_34_2005, p.54]\n\nThe consumer must fully and truthfully provide requested information, accurately disclose financial obligations, and provide authentic documentation for the affordability assessment. [nca_act_34_2005, p.54] [nca_affordability_regs_2015, p.14]\n\nThe credit provider must calculate discretionary income, consider monthly debt repayments shown on the consumer’s credit-bureau profile, and consider maintenance obligations and other necessary expenses. [nca_affordability_regs_2015, p.16]\n\nThe credit provider must consider the consumer’s debt-repayment history within seven business days before initially approving credit or increasing an existing credit limit. [nca_affordability_regs_2015, p.16]\n\nAny assessment mechanism or procedure used by the credit provider must produce a fair and objective assessment and be consistent with the affordability-assessment regulations. [nca_act_34_2005, p.54-55]", "citations": [{"doc_id": "nca_act_34_2005", "page": 54, "section_ref": "s 81", "verified": true}, {"doc_id": "nca_act_34_2005", "page": 54, "section_ref": "s 81", "verified": true}, {"doc_id": "nca_affordability_regs_2015", "page": 14, "section_ref": null, "verified": true}, {"doc_id": "nca_affordability_regs_2015", "page": 16, "section_ref": null, "verified": true}, {"doc_id": "nca_affordability_regs_2015", "page": 16, "section_ref": null, "verified": true}, {"doc_id": "nca_act_34_2005", "page": 54, "section_ref": "s 81", "verified": true}, {"doc_id": "nca_act_34_2005", "page": 55, "section_ref": "s 82", "verified": true}], "closed_book": {"answer": "If the buy-now-pay-later arrangement is a credit agreement under the National Credit Act, the provider must perform the prescribed affordability assessment before granting credit and avoid reckless lending. It must verify the consumer’s income and consider statutory deductions, reasonable living expenses, existing debt repayments and the proposed instalments, using the prescribed supporting information (such as payslips and/or bank statements) to establish sufficient discretionary income.", "judges": {"llama": {"correctness": "answered_unanswerable", "support": null}, "qwen": {"correctness": "answered_unanswerable", "support": null}}, "refused": false}, "evidence": [], "id": "t50", "judges": {"llama": {"correctness": "answered_unanswerable", "support": null}, "qwen": {"correctness": "answered_unanswerable", "support": null}}, "notices": [], "passages": [{"doc_id": "nca_act_34_2005", "pages": [54, 54], "section": "81.   Prevention of reckless credit.—(1)  When applying for a credit agreement, and while that application is", "text": "being considered by the credit provider, the prospective consumer must fully and truthfully answer any requests for information made by the credit provider as part of the assessment required by this section. (2)  A credit provider must not enter into a credit agreement without first taking reasonable steps to assess— the proposed consumer’s— (i) general understanding and appreciation of the risks and costs of the proposed credit, and of the rights and obligations of a consumer under a credit agreement; (ii) debt re­payment history as a consumer under credit agreements; (iii) existing financial means, prospects and obligations; and whether there is a reasonable basis to conclude that any commercial purpose may prove to be successful, if the consumer has such a purpose for applying for that credit agreement. (3)  A credit provider must not enter into a reckless credit agreement with a prospective consumer."}, {"doc_id": "nca_act_34_2005", "pages": [54, 55], "section": "82.   Assessment mechanisms and procedures.—(1)  A credit provider may determine for itself the evaluative", "text": "materially affected the ability of the credit provider to make a proper assessment. ( date of commencement of s. 81 : 1 june, 2007. ) mechanisms or models and procedures to be used in meeting its assessment obligations under section 81, provided that any such mechanism, model or procedure results in a fair and objective assessment and must not be inconsistent with the affordability assessment regulations made by the Minister. [Sub­s. (1) substituted by s. 24 (a) of Act No. 19 of 2014.] (2)  The Minister must, on recommendation of the National Credit Regulator, make affordability assessment regulations. [Sub­s. (2) substituted by s. 24 (a) of Act No. 19 of 2014.] (3)  . . . . . . [Sub­s. (3) deleted by s. 24 (b) of Act No. 19 of 2014.] (4)  . . . . . . [Sub­s. (4) deleted by s. 24 (b) of Act No. 19 of 2014.] (Date of commencement of s. 82: 1 June, 2007.)"}, {"doc_id": "nca_affordability_regs_2015", "pages": [14, 14], "section": "through which they do not receive a payslip or proof of income as", "text": "of income ; or latest three ( 3 ) months bank statements ; ( c ) consumers that are self - employed, informally employed or employed in a way contemplated in (a) or (b) above by requiring: (1) latest three (3) months bank statements; or (ii) latest financial statements. Where the consumer's monthly gross income shows material variance, the average gross income over the period of not less than three (3)pay periods preceding the credit application must be utilised. (6) The consumer must accurately disclose to the credit provider all financial obligations to enable the credit provider to conduct the affordability assessment. (7) The consumer must provide authentic documentation to the credit provider to enable the credit provider to conduct the affordability assessment. 18"}, {"doc_id": "nca_affordability_regs_2015", "pages": [16, 16], "section": "through which they do not receive a payslip or proof of income as", "text": "(11) The credit provider may however on an exceptional basis, where justified, accept the consumer's declared minimum expenses which are lower than those set out in table 1 provided the questionnaire set out in the Schedule, as issued from time to time, is completed by the consumer or joint consumers. (12) When conducting the affordability assessment, the credit provider must: - (a) calculate the consumer's discretionary income; (b) take into account all monthly debt repayment obligations in terms of credit agreements as reflected on the consumer's credit profile held by a registered credit bureau; and (c) take into account maintenance obligations and other necessary expenses. Debt re-payment history as a Consumer under Credit Agreements (13) A credit provider must take into account the consumer's debt repayment history as a consumer under credit agreements, as envisaged in section 81(2)(a) and must ensure that this requirement is performed: - (a) within seven(7)business days immediately prior to the initial approval of credit or the increasing of an existing credit limit; and (b) within fourteen (14) business days with regards to mortgages."}], "question": "How must a credit provider assess affordability for a buy-now-pay-later product?", "reference_answer": "", "refusal_reason": null, "refused": false, "type": "unanswerable"}, {"answer": null, "citations": [], "closed_book": {"answer": "A South African resident may generally transfer up to **R1 million per calendar year** abroad under the **Single Discretionary Allowance**, without prior approval, subject to bank checks. A further **R10 million per calendar year** may generally be transferred under the **Foreign Investment Allowance**, subject to tax-compliance requirements and the bank’s approval.", "judges": {"llama": {"correctness": "answered_unanswerable", "support": null}, "qwen": {"correctness": "answered_unanswerable", "support": null}}, "refused": false}, "evidence": [], "id": "t51", "judges": {"llama": {"correctness": "refused", "support": null}, "qwen": {"correctness": "refused", "support": null}}, "notices": [], "passages": [], "question": "How much foreign currency may a bank customer send abroad each year under exchange control rules?", "reference_answer": "", "refusal_reason": "model_refusal", "refused": true, "type": "unanswerable"}, {"answer": null, "citations": [], "closed_book": {"answer": "In South Africa, the interchange fee is capped at **0.20% of the transaction value for debit cards** and **0.30% for credit cards**. These are maximum rates; a lower rate may apply by agreement.", "judges": {"llama": {"correctness": "answered_unanswerable", "support": null}, "qwen": {"correctness": "answered_unanswerable", "support": null}}, "refused": false}, "evidence": [], "id": "t52", "judges": {"llama": {"correctness": "refused", "support": null}, "qwen": {"correctness": "refused", "support": null}}, "notices": [], "passages": [], "question": "What cap applies to the interchange fee a bank earns on card transactions?", "reference_answer": "", "refusal_reason": "model_refusal", "refused": true, "type": "unanswerable"}, {"answer": null, "citations": [], "closed_book": {"answer": "The Prudential Authority expects banks to govern AI as a material risk, with clear board and senior-management accountability, robust data governance, model validation, documentation, security, and ongoing monitoring. Banks should also address model bias, explainability, customer protection, operational resilience, outsourcing and third-party risks, and retain meaningful human oversight. AI use must comply with existing prudential, risk-management, consumer-protection and regulatory-reporting requirements.", "judges": {"llama": {"correctness": "answered_unanswerable", "support": null}, "qwen": {"correctness": "answered_unanswerable", "support": null}}, "refused": false}, "evidence": [], "id": "t53", "judges": {"llama": {"correctness": "refused", "support": null}, "qwen": {"correctness": "refused", "support": null}}, "notices": [], "passages": [], "question": "What does the Prudential Authority expect of banks that use artificial intelligence models?", "reference_answer": "", "refusal_reason": "model_refusal", "refused": true, "type": "unanswerable"}, {"answer": null, "citations": [], "closed_book": {"answer": "In South Africa, Islamic banking products are generally included in a bank’s risk-weighted assets and capital adequacy calculation according to their underlying economic and credit risks, rather than being exempt because they are Sharia-compliant. The applicable treatment depends on the structure—for example, an ijara is treated broadly like a lease exposure, while mudarabah or musharakah involves investment/equity-type risk—and must comply with the Prudential Authority’s capital rules.", "judges": {"llama": {"correctness": "answered_unanswerable", "support": null}, "qwen": {"correctness": "answered_unanswerable", "support": null}}, "refused": false}, "evidence": [], "id": "t54", "judges": {"llama": {"correctness": "refused", "support": null}, "qwen": {"correctness": "refused", "support": null}}, "notices": [], "passages": [], "question": "How are Islamic banking products treated when a bank calculates its capital requirement?", "reference_answer": "", "refusal_reason": "model_refusal", "refused": true, "type": "unanswerable"}, {"answer": null, "citations": [], "closed_book": {"answer": "A South African bank must submit its Internal Capital Adequacy Assessment Process (ICAAP) document to the Prudential Authority at least annually. The Authority may also require more frequent submissions where appropriate.", "judges": {"llama": {"correctness": "answered_unanswerable", "support": null}, "qwen": {"correctness": "answered_unanswerable", "support": null}}, "refused": false}, "evidence": [], "id": "t55", "judges": {"llama": {"correctness": "refused", "support": null}, "qwen": {"correctness": "refused", "support": null}}, "notices": [], "passages": [], "question": "How often must a bank submit its internal capital adequacy assessment to the regulator?", "reference_answer": "", "refusal_reason": "model_refusal", "refused": true, "type": "unanswerable"}, {"answer": null, "citations": [], "closed_book": {"answer": "A consumer must generally pay a minimum deposit of **10% of the vehicle’s purchase price** when it is financed by a credit provider under South African regulations.", "judges": {"llama": {"correctness": "answered_unanswerable", "support": null}, "qwen": {"correctness": "answered_unanswerable", "support": null}}, "refused": false}, "evidence": [], "id": "t56", "judges": {"llama": {"correctness": "refused", "support": null}, "qwen": {"correctness": "refused", "support": null}}, "notices": [], "passages": [], "question": "What minimum deposit must a consumer put down when a credit provider finances a vehicle?", "reference_answer": "", "refusal_reason": "model_refusal", "refused": true, "type": "unanswerable"}, {"answer": "The payment distribution agent must provide the consumer with a monthly statement, in a form chosen by the consumer, such as email, SMS, MMS, fax or a written statement. [nca_affordability_regs_2015, p.8]\n\nThe statement must show payment dates and amounts, the credit providers paid and amounts paid, undistributed funds, outstanding balances under the debt-rearrangement plan or order with a disclaimer that balances may change, payment-distribution-agent fees, payments to the debt counsellor and payments to credit providers. [nca_affordability_regs_2015, p.8]", "citations": [{"doc_id": "nca_affordability_regs_2015", "page": 8, "section_ref": null, "verified": true}, {"doc_id": "nca_affordability_regs_2015", "page": 8, "section_ref": null, "verified": true}], "closed_book": {"answer": "They must provide the consumer with regular, itemised statements showing payments received, amounts and dates distributed to each credit provider, fees or deductions, and the remaining balance. The payment-distribution agency must also provide transaction-level records and reconcile the account, enabling the consumer to verify that distributions match the debt-rearrangement order.", "judges": {"llama": {"correctness": "incorrect", "support": null}, "qwen": {"correctness": "incorrect", "support": null}}, "refused": false}, "evidence": [{"doc_id": "nca_affordability_regs_2015", "page": 12, "quote": "A debt counselor must not collect and distribute monies on behalf of consumers."}], "id": "t57", "judges": {"llama": {"correctness": "incorrect", "support": "supported"}, "qwen": {"correctness": "incorrect", "support": "supported"}}, "notices": [], "passages": [{"doc_id": "nca_affordability_regs_2015", "pages": [8, 8], "section": "was involuntarily deregistered in terms of public", "text": ") fees of the payment distribution agent ; ( viii ) payments made to the debt counsellor ; and ( ix ) payments made to the credit providers. (d) provide a monthly statement referred to in sub-regulation 8(c),in a manner chosen by the consumer which may be in the form of an e-mail, short message service (sms), multi-media messaging service (mms), fax or written statement; (e) comply with any other requirements that may be imposed by the National Credit Regulator in its conditions of registration and any guidelines that may be issued by the National Credit Regulator from time to time; (f) deposit monies collected from consumers into a trust account opened at a registered bank and distribute the monies to the credit providers and debt counsellors; (g) distribute monies received within five (5) days of receipt, failure which reasons must be submitted to the National Credit Regulator. 12 ; ( g ) distribute monies received within five ( 5 ) days of receipt, failure which reasons must be submitted to the national credit regulator. 12"}, {"doc_id": "nca_affordability_regs_2015", "pages": [8, 8], "section": "was involuntarily deregistered in terms of public", "text": "(c) on a monthly basis provide a statement to the consumer reflecting the following information:- (i) date of receipt of payment; (ii) amount of payment received; (iii) names of the consumer's credit providers who received payments during the relevant month and the actual amounts paid; (v) undistributed funds; (vi) outstanding balances under the debt re-arrangement plan, court, or tribunal order as the case may be, reflecting a disclaimer to the effect that the outstanding balances may be adjusted from time to time after the debt counsellor has provided the payment distribution agent with updated transactions from credit providers including, interests; (vii) fees of the payment distribution agent; (viii) payments made to the debt counsellor; and (ix) payments made to the credit providers."}], "question": "Since debt counsellors now collect and distribute consumers' money under the 2015 regulations, how do they account to consumers for it?", "reference_answer": "The premise is incorrect: the regulation says a debt counsellor must not collect and distribute monies on behalf of consumers.", "refusal_reason": null, "refused": false, "type": "false_premise"}, {"answer": "No, the Reserve Bank may designate the Registrar of Deposit-taking Institutions, subject to the Minister’s approval. [banks_act_94_1990, p.10]", "citations": [{"doc_id": "banks_act_94_1990", "page": 10, "section_ref": "s 15", "verified": true}], "closed_book": {"answer": "No. Under the 1990 Act, the Minister designates the Registrar only after consulting the Governor of the South African Reserve Bank.", "judges": {"llama": {"correctness": "incorrect", "support": null}, "qwen": {"correctness": "partial", "support": null}}, "refused": false}, "evidence": [{"doc_id": "banks_act_94_1990", "page": 10, "quote": "The Reserve Bank shall, subject to the approval of the Minister, designate"}], "id": "t58", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "correct", "support": "partial"}}, "notices": ["banks_act_94_1990 is a dated historical snapshot that may not reflect later amendments as of 2026-09-24 (no corpus document confirms this; see the manifest's external source)."], "passages": [{"doc_id": "banks_act_94_1990", "pages": [10, 10], "section": "15 officer or employee in its service as Deputy Registrar of Deposit-taking Institutions,", "text": "##gazetie, 11july1990 19 deposit - taking institutions acf, 1990 chapter ii administration of acr office for deposit - taking institutions Pretoria called the Office for Deposit-taking Institutions, and at the head of such office shall be a person to be styled the Registrar of Deposit-taking Institutions. Registrar and Deputy Registrar of Deposit-taking Institutions shall perform, under the control of the said Bank and in accordance with the .directions issued by that Bank from time to time, the functions assigned to the Registrar by or under this Act. (2) The Reserve Bank may, subject to the approval of the Minister, designate an who shall, subject to the control and directions of the Registrar, be competent to perform any function which the Registrar is permitted or required to perform. Delegation of powers and assignment of functions by Registrar"}], "question": "Does the Minister alone designate the Registrar of Deposit-taking Institutions under the 1990 Act?", "reference_answer": "No. The Reserve Bank designates the Registrar, subject to the Minister's approval, rather than the Minister acting alone.", "refusal_reason": null, "refused": false, "type": "false_premise"}, {"answer": "No, the conduct standard for banks was published in 2020, while the Financial Sector Regulation Act was introduced in 2018. [fsca_press_conduct_standard_banks_2020, p.1]", "citations": [{"doc_id": "fsca_press_conduct_standard_banks_2020", "page": 1, "section_ref": null, "verified": true}], "closed_book": {"answer": "No. The Financial Sector Regulation Act 9 of 2017 came into effect in 2018, but the Conduct Standard for Banks was published later, as Conduct Standard 1 of 2020.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "correct", "support": null}}, "refused": false}, "evidence": [{"doc_id": "fsca_press_conduct_standard_banks_2020", "page": 1, "quote": "FSCA Press Release 08 July 2020 FSCA publishes the conduct standard for banks"}], "id": "t59", "judges": {"llama": {"correctness": "correct", "support": "supported"}, "qwen": {"correctness": "correct", "support": "supported"}}, "notices": [], "passages": [{"doc_id": "fsca_press_conduct_standard_banks_2020", "pages": [1, 1], "section": "", "text": "Transitional Management Committee: AM Sithole (Commissioner)    DP Tshidi    CD da Silva    JA Boyd     MM du Toit    LP Kekana   K Gibson     OB Makhubela    P Mogase FSCA Press Release 08 July 2020 FSCA publishes the conduct standard for banks The Financial Sector Conduct Authority (FSCA) has published the conduct standard for banks along with a document detailing the expected impact of the conduct standard, and a report on the consultation process. The publication of these documents is the first step towards rolling out a comprehensive market conduct regulatory framework for the banking sector. When the Financial Sector Regulation Act (FSRA) was introduced in 2018, the FSCA was given the explicit mandate of regulating and supervising the way banking institutions conduct themselves in relation to the provision of financial products and services to customers. As part of fulfilling this mandate, and considering various risks identified in the sector, the FSCA developed the conduct standard which enables it to supervise banks. The conduct standard underwent a comprehensive public consultation process, coupled with industry specific engagements. It was also submitted to Parliament as required in terms of section 103 of the FSRA."}], "question": "Was the conduct standard for banks published in 2018, when the Financial Sector Regulation Act was introduced?", "reference_answer": "No. The Act was introduced in 2018, but the conduct standard for banks was not published until 8 July 2020.", "refusal_reason": null, "refused": false, "type": "false_premise"}, {"answer": "The review identifies it as a concern that intermediaries may be entitled to commission solely for selling a policy, regardless of whether advice or any other service is provided to the customer. [fsca_rdr_2014, p.23]\n\nThe review proposes that ongoing fees or commission may only be paid where ongoing advice and services are actually rendered. [fsca_rdr_2014, p.6]", "citations": [{"doc_id": "fsca_rdr_2014", "page": 23, "section_ref": null, "verified": true}, {"doc_id": "fsca_rdr_2014", "page": 6, "section_ref": null, "verified": true}], "closed_book": {"answer": "It is not intended to be an unconditional entitlement: ongoing remuneration is meant to compensate for ongoing advice or other agreed services, with disclosure and customer agreement. Trail or ongoing commissions may nevertheless continue under transitional or legacy arrangements, which can make payment persist even where service is limited; that is a recognised concern rather than the core justification of the RDR.", "judges": {"llama": {"correctness": "correct", "support": null}, "qwen": {"correctness": "correct", "support": null}}, "refused": false}, "evidence": [{"doc_id": "fsca_rdr_2014", "page": 6, "quote": "Ongoing fees and/or commission may only be paid if ongoing advice and services are indeed rendered"}], "id": "t60", "judges": {"llama": {"correctness": "incorrect", "support": "supported"}, "qwen": {"correctness": "correct", "support": "supported"}}, "notices": ["fsca_rdr_2014 is a consultation document, not a final published instrument.", "fsca_rdr_2014 is a dated historical snapshot that may not reflect later amendments as of 2026-09-08 (no corpus document confirms this; see the manifest's external source)."], "passages": [{"doc_id": "fsca_rdr_2014", "pages": [23, 23], "section": "CHAPTER 3: RISKS AND BENEFITS OF THE CURRENT LANDSCAPE", "text": "the possibility of the customer paying twice for the same services ( such as paying a “ policyholder fee ” over and above commission – see below ). The low visibility of the impact of commission also undermines accountability for the quality of advice, and customer rights to recourse are not always clear. As customers may not always be aware whether or how much they are paying for advice, or that they are paying for it at all, there is a weaker accountability mechanism when it comes to the quality of advice. Often, the cost of ongoing commissions (for example commission on annual premium escalations) remains “built in” to the product cost even once the intermediary who initially sold the product no longer has a relationship with the insurer concerned and no ongoing commissions are in fact being paid to the intermediary. O Entitlement to commission is not dependent on providing advice: Although the FAIS framework imposes strict quality controls on the advice process where advice is indeed provided, the regulatory framework imposes no obligations on insurance intermediaries to provide advice before being entitled to commission."}, {"doc_id": "fsca_rdr_2014", "pages": [23, 23], "section": "CHAPTER 3: RISKS AND BENEFITS OF THE CURRENT LANDSCAPE", "text": "the advice process where advice is indeed provided, the regulatory framework imposes no obligations on insurance intermediaries to provide advice before being entitled to commission. As the commission agreement exists solely between the insurer and the intermediary, the intermediary is typically entitled to regulated commission solely on the basis of selling a policy, regardless of whether advice or any other service is provided to the customer. Accordingly, the customer has no right of recourse against either the insurer or the intermediary for reversal or recovery of commission costs in the event of dissatisfaction with the intermediary’s advice or either the insurer or the intermediary for reversal or recovery of commission costs in the event of dissatisfaction with the intermediary ’ s advice or"}, {"doc_id": "fsca_rdr_2014", "pages": [6, 6], "section": "EXECUTIVE SUMMARY", "text": "As part of this aim, intermediary remuneration should not undermine reasonable customer benefit expectations or inhibit customers’ access to their savings (such as through early termination charges designed to recover commission costs) O The regulatory framework should recognise the range of services available, the related remuneration for these, and whom may pay or receive it O All remuneration must be reasonable and commensurate with the actual services rendered O Remuneration structures should strike a balance between supporting ongoing service and adequately compensating intermediaries for up-front advice and intermediary services O Ongoing fees and/or commission may only be paid if ongoing advice and services are indeed rendered O An intermediary may not be remunerated for the same or a similar service twice O All fees paid by customers must be motivated, disclosed and explicitly agreed to by the customer O The different types of services and fees should be readily comparable by customers; and O Remuneration structures should promote a level playing field between different types of intermediaries providing similar services."}], "question": "The retail distribution review lets intermediaries collect ongoing commission whether or not they service the customer, so how is that justified?", "reference_answer": "The premise is incorrect: ongoing fees or commission may only be paid if ongoing advice and services are actually rendered.", "refusal_reason": null, "refused": false, "type": "false_premise"}], "metrics": {"answer_rate": {"ci95": [0.6346046409154885, 0.8669230897101096], "k": 37, "n": 48, "rate": 0.7708333333333334}, "refusal_recall": {"ci95": [0.6461140782014047, 0.9851352905492264], "k": 11, "n": 12, "rate": 0.9166666666666666}, "task_outcome": {"ci95": [0.6821795390818299, 0.8817161026314104], "k": 48, "n": 60, "rate": 0.8}}, "run_date": "2026-09-26", "titles": {"banks_act_94_1990": "Banks Act 94 of 1990 (as first published, then titled Deposit-taking Institutions Act)", "fsca_conduct_standard_otc_derivatives_2018": "Conduct Standard for Authorised Over-the-Counter Derivative Providers (April 2018)", "fsca_cs3_2020_banks": "Conduct Standard 3 of 2020 (BA): Conduct Standard for Banks", "fsca_press_conduct_standard_banks_2020": "Press Release: Conduct Standard for Banks (8 July 2020)", "fsca_rdr_2014": "Retail Distribution Review (2014)", "fsca_rdr_intermediary_segmentation_2019": "Retail Distribution Review: Intermediary Activity Segmentation and Related Matters (December 2019)", "fsca_tcf_2011": "Treating Customers Fairly (TCF) (2011)", "fsr_act_9_2017": "Financial Sector Regulation Act 9 of 2017", "ifrs9_issued_2021": "IFRS 9 Financial Instruments (issued text, 2021 edition)", "ifrs9_project_summary_2014": "IFRS 9 Financial Instruments: Project Summary (July 2014)", "nca_act_34_2005": "National Credit Act 34 of 2005", "nca_affordability_regs_2015": "National Credit Regulations including Affordability Assessment Regulations (GN R202 of 13 March 2015)", "nca_notebook_brochure": "Notebook on the National Credit Act, 2005 (plain-language explainer)", "nca_regs_2006": "National Credit Regulations, 2006 (GN R489 of 31 May 2006)", "ncr_guideline_disputed_credit_complaints": "Guideline 00 <script>

[["Answerable questions answered", D.metrics.answer_rate], ["Unanswerable questions refused", D.metrics.refusal_recall], ["Closed-book: unanswerable refused", D.closed_metrics.refusal_recall]].forEach(([k, r]) => stats.append(el("div", "stat", `${k}: ${pct(r)}`)));

const labels = j => Object.entries(j || {}).map(([name, l]) => { const s = el("span"); s.append(`${name}: `); s.append(el("span", l.correctness || "", l.correctness || "-")); if (l.support) { s.append(", support "); s.append(el("span", l.support, l.support)); } return s; });
function card(i) {
