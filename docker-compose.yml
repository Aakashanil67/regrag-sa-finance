services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    # bind-mounts the whole repo over the image's /app so corpus/, chroma/, reports/ and the
    # sqlite log/cache files (none of them baked into the image. corpus and chroma are
    # gitignored, built locally via fetch_corpus.py + store.py --rebuild) are visible without a
    # rebuild, and so a code change is picked up on container restart rather than a full rebuild
    volumes:
      - .:/app
    working_dir: /app

  chat:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - API_URL=http://api:8000
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      api:
        condition: service_healthy

  ops:
    build:
      context: .
      dockerfile: Dockerfile.ui
    command: ["streamlit", "run", "app/ops.py", "--server.address=0.0.0.0", "--server.port=8502"]
    ports:
      - "127.0.0.1:8502:8502"
    environment:
      - API_URL=http://api:8000
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      api:
        condition: service_healthy
